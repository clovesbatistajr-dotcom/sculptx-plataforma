<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Suplementação - SculptX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .suplementacao-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1f2e;
            min-height: 100vh;
        }

        .suplementacao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .suplementacao-header h1 {
            color: white;
            font-size: 2rem;
            margin: 0;
        }

        .btn-voltar {
            background: #2d9d78;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-voltar:hover {
            background: #1e7a5e;
        }

        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            background: #2d3748;
            color: #ccc;
            border: 2px solid #444;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filtro-btn.ativo {
            background: #2d9d78;
            color: white;
            border-color: #2d9d78;
        }

        .filtro-btn:hover {
            border-color: #2d9d78;
        }

        .suplementos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .suplemento-card {
            background: #2d3748;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            transition: all 0.3s ease;
        }

        .suplemento-card:hover {
            border-color: #2d9d78;
            box-shadow: 0 0 20px rgba(45, 157, 120, 0.2);
        }

        .suplemento-header {
            background: linear-gradient(135deg, #2d9d78, #1e7a5e);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .suplemento-emoji {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .suplemento-nome {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .suplemento-categoria {
            font-size: 0.85rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .suplemento-content {
            padding: 20px;
        }

        .info-row {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .info-label {
            color: #999;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-valor {
            color: white;
            font-size: 1rem;
        }

        .beneficios {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .beneficio-titulo {
            color: #2d9d78;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .beneficio-lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .beneficio-lista li {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 6px;
            padding-left: 15px;
            position: relative;
        }

        .beneficio-lista li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #2d9d78;
            font-weight: bold;
        }

        .protocolo-objetivo {
            background: #2d3748;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            border-left: 4px solid #2d9d78;
        }

        .protocolo-titulo {
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .protocolo-recomendacao {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            color: #ccc;
        }

        .recomendacao-titulo {
            color: #2d9d78;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .recomendacao-texto {
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="suplementacao-container">
        <div class="suplementacao-header">
            <h1>💊 Protocolo de Suplementação</h1>
            <a href="/dashboard.html" class="btn-voltar">← Voltar ao Dashboard</a>
        </div>

        <div class="filtros" id="filtros"></div>
        
        <div class="suplementos-grid" id="suplementos"></div>

        <div class="protocolo-objetivo" id="protocolo-recomendado"></div>
    </div>

    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        
        if (!usuario) {
            window.location.href = '/onboarding.html';
        }

        const suplementos = {
            'Whey Protein': {
                categoria: 'Proteína',
                emoji: '🥛',
                dosagem: '30-40g',
                horario: 'Pós-treino',
                beneficios: ['Recuperação muscular', 'Ganho de massa', 'Síntese proteica'],
                indicado: ['hipertrofia', 'definição']
            },
            'Creatina': {
                categoria: 'Performance',
                emoji: '⚡',
                dosagem: '5g',
                horario: 'Diariamente',
                beneficios: ['Força e resistência', 'Ganho muscular', 'Rendimento'],
                indicado: ['hipertrofia']
            },
            'BCAA': {
                categoria: 'Aminoácidos',
                emoji: '💪',
                dosagem: '5-10g',
                horario: 'Pré e pós-treino',
                beneficios: ['Recuperação', 'Prevenção catabolismo', 'Energia'],
                indicado: ['hipertrofia', 'definição']
            },
            'Ômega 3': {
                categoria: 'Saúde',
                emoji: '🐟',
                dosagem: '2-3g',
                horario: 'Com refeições',
                beneficios: ['Saúde cardiovascular', 'Anti-inflamatório', 'Cognição'],
                indicado: ['hipertrofia', 'definição']
            },
            'Multivitamínico': {
                categoria: 'Micronutrientes',
                emoji: '🌈',
                dosagem: '1 dose',
                horario: 'Café da manhã',
                beneficios: ['Imunidade', 'Energia', 'Saúde geral'],
                indicado: ['hipertrofia', 'definição']
            },
            'Cafeína': {
                categoria: 'Estimulante',
                emoji: '☕',
                dosagem: '100-200mg',
                horario: 'Pré-treino',
                beneficios: ['Energia', 'Foco', 'Queima de gordura'],
                indicado: ['definição', 'hipertrofia']
            },
            'Beta-Alanina': {
                categoria: 'Performance',
                emoji: '🔥',
                dosagem: '3-5g',
                horario: 'Distribuída no dia',
                beneficios: ['Resistência', 'Reduz fadiga', 'Hipertrofia'],
                indicado: ['hipertrofia']
            },
            'Glutamina': {
                categoria: 'Aminoácidos',
                emoji: '🛡️',
                dosagem: '5-10g',
                horario: 'Pós-treino',
                beneficios: ['Recuperação', 'Imunidade', 'Força'],
                indicado: ['hipertrofia']
            }
        };

        // Renderizar filtros
        const categoriasUnicas = [...new Set(Object.values(suplementos).map(s => s.categoria))];
        const filtrosDiv = document.getElementById('filtros');

        filtrosDiv.innerHTML = '<button class="filtro-btn ativo" data-filtro="todos">Todos</button>';
        categoriasUnicas.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filtro-btn';
            btn.textContent = cat;
            btn.dataset.filtro = cat.toLowerCase();
            filtrosDiv.appendChild(btn);
        });

        // Renderizar suplementos
        function renderizarSuplemientos(filtro = 'todos') {
            const container = document.getElementById('suplementos');
            container.innerHTML = '';

            Object.entries(suplementos).forEach(([nome, dados]) => {
                if (filtro !== 'todos' && dados.categoria.toLowerCase() !== filtro) return;

                const estaIndicado = dados.indicado.includes(usuario.objetivo.toLowerCase());
                
                const html = `
                    <div class="suplemento-card">
                        <div class="suplemento-header">
                            <div class="suplemento-emoji">${dados.emoji}</div>
                            <div class="suplemento-nome">${nome}</div>
                            <div class="suplemento-categoria">${dados.categoria}</div>
                        </div>
                        <div class="suplemento-content">
                            <div class="info-row">
                                <div class="info-label">Dosagem</div>
                                <div class="info-valor">${dados.dosagem}</div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">Horário Ideal</div>
                                <div class="info-valor">${dados.horario}</div>
                            </div>
                            <div class="beneficios">
                                <div class="beneficio-titulo">Benefícios</div>
                                <ul class="beneficio-lista">
                                    ${dados.beneficios.map(b => `<li>${b}</li>`).join('')}
                                </ul>
                            </div>
                            ${estaIndicado ? '<div style="background: #2d9d78; color: white; padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 0.85rem; font-weight: 600; text-align: center;">✓ Recomendado para seu objetivo</div>' : ''}
                        </div>
                    </div>
                `;

                const div = document.createElement('div');
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        // Filtros
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');
                renderizarSuplemientos(btn.dataset.filtro);
            });
        });

        // Protocolo recomendado
        function gerarProtocoloRecomendado() {
            const objetivo = usuario.objetivo.toLowerCase();
            let suplementosRecomendados = Object.entries(suplementos)
                .filter(([, dados]) => dados.indicado.includes(objetivo))
                .map(([nome]) => nome);

            let titulo, descricao;

            if (objetivo === 'hipertrofia') {
                titulo = 'Protocolo para Ganho de Massa';
                descricao = 'Foco em recuperação, síntese proteica e performance no treino.';
            } else {
                titulo = 'Protocolo para Definição';
                descricao = 'Foco em energia, preservação muscular e otimização do metabolismo.';
            }

            const html = `
                <div class="protocolo-titulo">📋 ${titulo}</div>
                <p style="color: #ccc; margin-bottom: 20px;">${descricao}</p>
                
                ${suplementosRecomendados.map((nome, i) => {
                    const dados = suplementos[nome];
                    return `
                        <div class="protocolo-recomendacao">
                            <div class="recomendacao-titulo">${i + 1}. ${nome}</div>
                            <div class="recomendacao-texto">
                                <strong>Dosagem:</strong> ${dados.dosagem} | 
                                <strong>Horário:</strong> ${dados.horario}
                            </div>
                        </div>
                    `;
                }).join('')}
            `;

            document.getElementById('protocolo-recomendado').innerHTML = html;
        }

        renderizarSuplemientos();
        gerarProtocoloRecomendado();
    </script>
</body>
</html>
