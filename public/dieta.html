<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Dieta Personalizada | SculptX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1f2e;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #2d3748;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #a0aec0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #2d9d78 0%, #1e7e5f 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .refeicoes-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .refeicao {
            background: #2d3748;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .refeicao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #4a5568;
        }

        .refeicao-nome {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .refeicao-calorias {
            background: linear-gradient(135deg, #2d9d78 0%, #1e7e5f 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .alimentos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .alimento-card {
            background: #374151;
            border: 2px solid #4a5568;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .alimento-card:hover {
            border-color: #2d9d78;
            box-shadow: 0 5px 15px rgba(45, 157, 120, 0.3);
        }

        .alimento-nome {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .alimento-porcao {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 15px;
            background: #2d3748;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .macros {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .macro {
            background: #2d3748;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #2d9d78;
        }

        .macro-label {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .macro-valor {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .botao-substituir {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2d9d78 0%, #1e7e5f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .botao-substituir:hover {
            transform: translateY(-2px);
        }

        .botao-voltar {
            margin-bottom: 20px;
            padding: 12px 24px;
            background: transparent;
            color: #2d9d78;
            border: 2px solid #2d9d78;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .botao-voltar:hover {
            background: #2d9d78;
            color: white;
        }

        .refeicoes-container::-webkit-scrollbar {
            width: 8px;
        }

        .refeicoes-container::-webkit-scrollbar-track {
            background: #2d3748;
            border-radius: 10px;
        }

        .refeicoes-container::-webkit-scrollbar-thumb {
            background: #2d9d78;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .alimentos-grid {
                grid-template-columns: 1fr;
            }

            .macros {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 20px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="botao-voltar" onclick="window.location.href='dashboard.html'">← Voltar ao Dashboard</button>

        <div class="header">
            <h1>🍽️ Sua Dieta Personalizada</h1>
            <p>Protocolo adaptado conforme seu objetivo e macronutrientes</p>

            <div class="stats">
                <div class="stat-box">
                    <div class="label">Calorias Diárias</div>
                    <div class="value" id="caloriasDiarias">2500</div>
                </div>
                <div class="stat-box">
                    <div class="label">Proteína</div>
                    <div class="value" id="proteina">150g</div>
                </div>
                <div class="stat-box">
                    <div class="label">Carboidrato</div>
                    <div class="value" id="carboidrato">300g</div>
                </div>
                <div class="stat-box">
                    <div class="label">Gordura</div>
                    <div class="value" id="gordura">80g</div>
                </div>
            </div>
        </div>

        <div class="refeicoes-container" id="refeicoesContainer">
            <p style="text-align: center; color: #a0aec0; padding: 20px;">Carregando sua dieta...</p>
        </div>
    </div>

    <script>
        async function carregarDieta() {
            try {
                const usuarioData = localStorage.getItem('usuarioData');

                if (!usuarioData) {
                    document.getElementById('refeicoesContainer').innerHTML = 
                        '<p style="color: #a0aec0; text-align: center; padding: 40px;">Erro: Dados não encontrados.</p>';
                    return;
                }

                const usuario = JSON.parse(usuarioData);

                document.getElementById('caloriasDiarias').textContent = Math.round(usuario.calorias_alvo) + ' kcal';
                document.getElementById('proteina').textContent = Math.round(usuario.proteina_g) + 'g';
                document.getElementById('carboidrato').textContent = Math.round(usuario.carbo_g) + 'g';
                document.getElementById('gordura').textContent = Math.round(usuario.gordura_g) + 'g';

                const numRefeicoes = usuario.refeicoes || 4;
                const response = await fetch('/api/gerar-dieta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario_id: usuario.id,
                        calorias_alvo: usuario.calorias_alvo,
                        num_refeicoes: numRefeicoes,
                        macros: {
                            proteina: usuario.proteina_g,
                            carbo: usuario.carbo_g,
                            gordura: usuario.gordura_g
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Erro ao gerar dieta');
                }

                const data = await response.json();
                const dieta = data.dieta;

                let html = '';
                if (dieta.refeicoes && dieta.refeicoes.length > 0) {
                    dieta.refeicoes.forEach((refeicao, idx) => {
                        html += `
                            <div class="refeicao">
                                <div class="refeicao-header">
                                    <div class="refeicao-nome">${refeicao.nome}</div>
                                    <div class="refeicao-calorias">${Math.round(refeicao.calorias_alvo)} kcal</div>
                                </div>
                                
                                <div class="alimentos-grid">
                                    ${refeicao.opcoes ? refeicao.opcoes.map((alimento, i) => `
                                        <div class="alimento-card">
                                            <div class="alimento-nome">${alimento.nome}</div>
                                            <div class="alimento-porcao">${alimento.porcao}</div>

                                            <div class="macros">
                                                <div class="macro">
                                                    <div class="macro-label">Cal</div>
                                                    <div class="macro-valor">${Math.round(alimento.calorias)}</div>
                                                </div>
                                                <div class="macro">
                                                    <div class="macro-label">Prot</div>
                                                    <div class="macro-valor">${Math.round(alimento.proteina)}g</div>
                                                </div>
                                                <div class="macro">
                                                    <div class="macro-label">Carbo</div>
                                                    <div class="macro-valor">${Math.round(alimento.carbo)}g</div>
                                                </div>
                                                <div class="macro">
                                                    <div class="macro-label">Gord</div>
                                                    <div class="macro-valor">${Math.round(alimento.gordura)}g</div>
                                                </div>
                                            </div>

                                            <button class="botao-substituir" onclick="substituirAlimento('${refeicao.nome}', ${i})">
                                                🔄 Substituir Alimento
                                            </button>
                                        </div>
                                    `).join('') : ''}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = '<p style="color: #a0aec0; text-align: center; padding: 40px;">Nenhuma refeição disponível.</p>';
                }

                document.getElementById('refeicoesContainer').innerHTML = html;

            } catch (err) {
                console.error('Erro ao carregar dieta:', err);
                document.getElementById('refeicoesContainer').innerHTML = 
                    `<p style="color: #a0aec0; text-align: center; padding: 40px;">Erro: ${err.message}</p>`;
            }
        }

        function substituirAlimento(refeicaoNome, indice) {
            alert(`Substituir alimento #${indice + 1} da refeição: ${refeicaoNome}`);
        }

        carregarDieta();
    </script>
</body>
</html>
