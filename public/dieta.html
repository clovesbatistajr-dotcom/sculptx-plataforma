<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Dieta - SculptX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dieta-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1f2e;
            min-height: 100vh;
        }

        .dieta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dieta-header h1 {
            color: white;
            font-size: 2rem;
            margin: 0;
        }

        .btn-voltar {
            background: #2d9d78;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-voltar:hover {
            background: #1e7a5e;
        }

        .macros-info {
            background: #2d3748;
            border: 2px solid #2d9d78;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .macro-card {
            border-radius: 8px;
            padding: 15px;
            background: #1a1f2e;
        }

        .macro-label {
            color: #999;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .macro-value {
            color: #2d9d78;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .macro-unit {
            color: #666;
            font-size: 0.8rem;
        }

        .refeicoes-container {
            display: grid;
            gap: 20px;
        }

        .refeicao-card {
            background: #2d3748;
            border-radius: 12px;
            overflow: hidden;
            border-left: 4px solid #2d9d78;
        }

        .refeicao-header {
            background: #2d9d78;
            color: white;
            padding: 15px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .refeicao-content {
            padding: 20px;
        }

        .alimentos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .alimento-card {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #444;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .alimento-card:hover {
            border-color: #2d9d78;
            transform: translateY(-2px);
        }

        .alimento-nome {
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .alimento-info {
            color: #ccc;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .alimento-info div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .macro-prot {
            color: #ff6b6b;
        }

        .macro-carb {
            color: #4ecdc4;
        }

        .macro-fat {
            color: #ffd93d;
        }

        .btn-substituir {
            background: #2d9d78;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
        }

        .btn-substituir:hover {
            background: #1e7a5e;
        }

        .refeicao-totais {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .total-item {
            color: #999;
            font-size: 0.85rem;
        }

        .total-valor {
            color: #2d9d78;
            font-weight: 600;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="dieta-container">
        <div class="dieta-header">
            <h1>🍽️ Sua Dieta Personalizada</h1>
            <a href="/dashboard.html" class="btn-voltar">← Voltar ao Dashboard</a>
        </div>

        <div class="macros-info">
            <div class="macro-card">
                <div class="macro-label">Calorias Dia</div>
                <div class="macro-value" id="calorias">-</div>
            </div>
            <div class="macro-card">
                <div class="macro-label">Proteína</div>
                <div class="macro-value"><span id="proteina">-</span><span class="macro-unit">g</span></div>
            </div>
            <div class="macro-card">
                <div class="macro-label">Carboidrato</div>
                <div class="macro-value"><span id="carbo">-</span><span class="macro-unit">g</span></div>
            </div>
            <div class="macro-card">
                <div class="macro-label">Gordura</div>
                <div class="macro-value"><span id="gordura">-</span><span class="macro-unit">g</span></div>
            </div>
        </div>

        <div class="refeicoes-container" id="refeicoes"></div>
    </div>

    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        
        if (!usuario) {
            window.location.href = '/onboarding.html';
        }

        // Preencher macros
        document.getElementById('calorias').textContent = usuario.calorias_alvo;
        document.getElementById('proteina').textContent = usuario.proteina_g;
        document.getElementById('carbo').textContent = usuario.carbo_g;
        document.getElementById('gordura').textContent = usuario.gordura_g;

        const alimentos = {
            'Café da Manhã': [
                { nome: 'Ovo (3 unidades)', proteina: 18, carbo: 1, gordura: 15 },
                { nome: 'Aveia (40g)', proteina: 6, carbo: 27, gordura: 5 },
                { nome: 'Banana (1 média)', proteina: 1, carbo: 27, gordura: 0 },
                { nome: 'Leite Desnatado (200ml)', proteina: 7, carbo: 10, gordura: 0 }
            ],
            'Lanche da Manhã': [
                { nome: 'Whey Protein (30g)', proteina: 25, carbo: 3, gordura: 2 },
                { nome: 'Maçã (1 unidade)', proteina: 0, carbo: 25, gordura: 0 },
                { nome: 'Amendoim (30g)', proteina: 8, carbo: 6, gordura: 14 },
                { nome: 'Iogurte Grego (150g)', proteina: 20, carbo: 5, gordura: 5 }
            ],
            'Almoço': [
                { nome: 'Frango Peito (150g)', proteina: 42, carbo: 0, gordura: 3 },
                { nome: 'Arroz Integral (150g cozido)', proteina: 4, carbo: 30, gordura: 1 },
                { nome: 'Brócolis (200g)', proteina: 6, carbo: 8, gordura: 1 },
                { nome: 'Abacate (1/2 unidade)', proteina: 1, carbo: 7, gordura: 12 }
            ],
            'Lanche da Tarde': [
                { nome: 'Batata-Doce (150g)', proteina: 2, carbo: 28, gordura: 0 },
                { nome: 'Whey Protein (30g)', proteina: 25, carbo: 3, gordura: 2 },
                { nome: 'Castanha do Pará (15g)', proteina: 4, carbo: 3, gordura: 15 },
                { nome: 'Tangerina (2 unidades)', proteina: 1, carbo: 24, gordura: 0 }
            ],
            'Jantar': [
                { nome: 'Salmão (150g)', proteina: 30, carbo: 0, gordura: 12 },
                { nome: 'Batata Doce (150g)', proteina: 2, carbo: 28, gordura: 0 },
                { nome: 'Espinafre (200g)', proteina: 2, carbo: 3, gordura: 0 },
                { nome: 'Azeite de Oliva (1 colher)', proteina: 0, carbo: 0, gordura: 14 }
            ]
        };

        const container = document.getElementById('refeicoes');

        Object.entries(alimentos).forEach(([ refeicao, alimensList ]) => {
            let totalProt = 0, totalCarb = 0, totalFat = 0;

            const html = `
                <div class="refeicao-card">
                    <div class="refeicao-header">🥗 ${refeicao}</div>
                    <div class="refeicao-content">
                        <div class="alimentos-grid">
                            ${alimensList.map((alim, i) => {
                                totalProt += alim.proteina;
                                totalCarb += alim.carbo;
                                totalFat += alim.gordura;
                                return `
                                    <div class="alimento-card">
                                        <div class="alimento-nome">${alim.nome}</div>
                                        <div class="alimento-info">
                                            <div><span class="macro-prot">Proteína:</span> <span>${alim.proteina}g</span></div>
                                            <div><span class="macro-carb">Carboidrato:</span> <span>${alim.carbo}g</span></div>
                                            <div><span class="macro-fat">Gordura:</span> <span>${alim.gordura}g</span></div>
                                        </div>
                                        <button class="btn-substituir">Substituir alimento</button>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="refeicao-totais">
                            <div>
                                <div class="total-item">Proteína</div>
                                <div class="total-valor macro-prot">${totalProt}g</div>
                            </div>
                            <div>
                                <div class="total-item">Carboidrato</div>
                                <div class="total-valor macro-carb">${totalCarb}g</div>
                            </div>
                            <div>
                                <div class="total-item">Gordura</div>
                                <div class="total-valor macro-fat">${totalFat}g</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const div = document.createElement('div');
            div.innerHTML = html;
            container.appendChild(div);
        });
    </script>
</body>
</html>
