<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino Personalizado | SculptX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1f2e;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #2d3748;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #a0aec0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #2d9d78 0%, #1e7e5f 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .dias-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .dia-treino {
            background: #2d3748;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border-left: 5px solid #2d9d78;
        }

        .dia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #4a5568;
        }

        .dia-nome {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .dia-tempo {
            background: linear-gradient(135deg, #2d9d78 0%, #1e7e5f 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .exercicios-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercicio-card {
            background: #374151;
            border: 2px solid #4a5568;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .exercicio-card:hover {
            border-color: #2d9d78;
            box-shadow: 0 5px 15px rgba(45, 157, 120, 0.3);
        }

        .checkbox-exercicio {
            width: 24px;
            height: 24px;
            margin-top: 5px;
            cursor: pointer;
            accent-color: #2d9d78;
            flex-shrink: 0;
        }

        .exercicio-card.completo {
            background: #2d3748;
            border-color: #2d9d78;
            opacity: 0.7;
        }

        .exercicio-card.completo .exercicio-nome {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .exercicio-info {
            flex: 1;
        }

        .exercicio-nome {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .exercicio-detalhes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detalhe {
            background: #2d3748;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #2d9d78;
            text-align: center;
        }

        .detalhe-label {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detalhe-valor {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .video-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 16px;
            background: #2d9d78;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .video-link:hover {
            background: #1e7e5f;
            transform: translateY(-2px);
        }

        .botao-voltar {
            margin-bottom: 20px;
            padding: 12px 24px;
            background: transparent;
            color: #2d9d78;
            border: 2px solid #2d9d78;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .botao-voltar:hover {
            background: #2d9d78;
            color: white;
        }

        .progresso-geral {
            background: #2d3748;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .progresso-geral h3 {
            color: #fff;
        }

        .progresso-geral p {
            color: #a0aec0;
            font-size: 14px;
        }

        .barra-progresso {
            background: #4a5568;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .barra-preenchida {
            height: 100%;
            background: linear-gradient(90deg, #2d9d78 0%, #1e7e5f 100%);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .exercicio-card {
                flex-direction: column;
            }

            .dia-nome {
                font-size: 20px;
            }

            .exercicio-detalhes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="botao-voltar" onclick="window.location.href='dashboard.html'">← Voltar ao Dashboard</button>

        <div class="progresso-geral">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3>Progresso Geral do Treino</h3>
                    <p>Complete os exercícios para evoluir</p>
                </div>
                <div style="font-size: 24px; font-weight: bold; color: #2d9d78;" id="percentualProgresso">0%</div>
            </div>
            <div class="barra-progresso">
                <div class="barra-preenchida" id="barraProgresso" style="width: 0%;"></div>
            </div>
        </div>

        <div class="header">
            <h1>💪 Seu Treino Personalizado</h1>
            <p>Protocolo de 30 fases progressivas com 2 meses cada</p>

            <div class="stats">
                <div class="stat-box">
                    <div class="label">Fase Atual</div>
                    <div class="value" id="faseAtual">1</div>
                </div>
                <div class="stat-box">
                    <div class="label">Total de Fases</div>
                    <div class="value">30</div>
                </div>
                <div class="stat-box">
                    <div class="label">Dias por Semana</div>
                    <div class="value" id="diasSemana">4</div>
                </div>
                <div class="stat-box">
                    <div class="label">Próxima Progressão</div>
                    <div class="value" id="proximaProgressao">2 meses</div>
                </div>
            </div>
        </div>

        <div class="dias-container" id="diasContainer">
            <p style="text-align: center; color: #a0aec0; padding: 20px;">Carregando seu treino...</p>
        </div>
    </div>

    <script>
        let treinoData = {};
        let exerciciosCompletos = {};

        async function carregarTreino() {
            try {
                const usuarioData = localStorage.getItem('usuarioData');

                if (!usuarioData) {
                    document.getElementById('diasContainer').innerHTML = 
                        '<p style="color: #a0aec0; text-align: center; padding: 40px;">Erro: Dados não encontrados.</p>';
                    return;
                }

                const usuario = JSON.parse(usuarioData);

                document.getElementById('faseAtual').textContent = '1';
                document.getElementById('diasSemana').textContent = usuario.dias_treino || 4;

                const response = await fetch('/api/gerar-treino', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario_id: usuario.id,
                        dias_treino: usuario.dias_treino || 4,
                        tempo_minuto: usuario.tempo_treino || 60,
                        local: usuario.local_treino || 'academia',
                        nivel: usuario.nivel,
                        objetivo: usuario.objetivo
                    })
                });

                if (!response.ok) {
                    throw new Error('Erro ao gerar treino');
                }

                const data = await response.json();
                treinoData = data.treino;

                renderizarTreino();

            } catch (err) {
                console.error('Erro ao carregar treino:', err);
                document.getElementById('diasContainer').innerHTML = 
                    `<p style="color: #a0aec0; text-align: center; padding: 40px;">Erro: ${err.message}</p>`;
            }
        }

        function renderizarTreino() {
            if (!treinoData.dias || treinoData.dias.length === 0) {
                document.getElementById('diasContainer').innerHTML = 
                    '<p style="color: #a0aec0; text-align: center; padding: 40px;">Nenhum dia de treino disponível.</p>';
                return;
            }

            let html = '';

            treinoData.dias.forEach((dia, diaIdx) => {
                const tempoTotal = dia.tempo_total_usado || 0;
                const diaNum = diaIdx + 1;
                const idDia = `dia-${diaNum}`;

                html += `
                    <div class="dia-treino" id="${idDia}">
                        <div class="dia-header">
                            <div class="dia-nome">Dia ${diaNum}</div>
                            <div class="dia-tempo">⏱️ ${tempoTotal} min</div>
                        </div>

                        <div class="exercicios-list">
                            ${dia.exercicios ? dia.exercicios.map((exercicio, exIdx) => {
                                const idExercicio = `ex-${diaNum}-${exIdx}`;
                                return `
                                    <div class="exercicio-card" id="${idExercicio}">
                                        <input type="checkbox" class="checkbox-exercicio" 
                                            onchange="marcarExercicio('${idExercicio}', '${diaNum}-${exIdx}')" />
                                        
                                        <div class="exercicio-info">
                                            <div class="exercicio-nome">${exercicio.nome}</div>

                                            <div class="exercicio-detalhes">
                                                <div class="detalhe">
                                                    <div class="detalhe-label">Séries</div>
                                                    <div class="detalhe-valor">${exercicio.series}x</div>
                                                </div>
                                                <div class="detalhe">
                                                    <div class="detalhe-label">Repetições</div>
                                                    <div class="detalhe-valor">${exercicio.repeticoes}</div>
                                                </div>
                                                <div class="detalhe">
                                                    <div class="detalhe-label">Descanso</div>
                                                    <div class="detalhe-valor">${exercicio.descanso_segundos}s</div>
                                                </div>
                                                <div class="detalhe">
                                                    <div class="detalhe-label">Tempo</div>
                                                    <div class="detalhe-valor">${exercicio.tempo_minutos}min</div>
                                                </div>
                                            </div>

                                            ${exercicio.link ? `
                                                <a href="${exercicio.link}" target="_blank" class="video-link">
                                                    ▶️ Assistir Tutorial no YouTube
                                                </a>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('') : ''}
                        </div>
                    </div>
                `;
            });

            document.getElementById('diasContainer').innerHTML = html;
            atualizarProgresso();
        }

        function marcarExercicio(idElemento, idExercicio) {
            const elemento = document.getElementById(idElemento);
            const checkbox = elemento.querySelector('.checkbox-exercicio');

            if (checkbox.checked) {
                elemento.classList.add('completo');
                exerciciosCompletos[idExercicio] = true;
            } else {
                elemento.classList.remove('completo');
                delete exerciciosCompletos[idExercicio];
            }

            atualizarProgresso();
        }

        function atualizarProgresso() {
            const totalExercicios = document.querySelectorAll('.exercicio-card').length;
            const completos = Object.keys(exerciciosCompletos).length;
            const percentual = totalExercicios > 0 ? Math.round((completos / totalExercicios) * 100) : 0;

            document.getElementById('percentualProgresso').textContent = percentual + '%';
            document.getElementById('barraProgresso').style.width = percentual + '%';
        }

        carregarTreino();
    </script>
</body>
</html>
