<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Treino - SculptX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .treino-container { max-width: 1200px; margin: 0 auto; padding: 20px; background: #1a1f2e; min-height: 100vh; }
        .treino-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .treino-header h1 { color: white; font-size: 2rem; margin: 0; }
        .btn-voltar { background: #2d9d78; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-voltar:hover { background: #1e7a5e; }
        .fase-info { background: #2d3748; border: 2px solid #2d9d78; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; }
        .info-item { text-align: center; }
        .info-label { color: #999; font-size: 0.82rem; text-transform: uppercase; margin-bottom: 8px; }
        .info-value { color: #2d9d78; font-size: 1.5rem; font-weight: bold; }
        .local-badge { background: #2d3748; border-left: 4px solid #ffd93d; padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; color: #ccc; }
        .local-badge strong { color: #ffd93d; }
        .dias-semana { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .dia-card { background: #2d3748; border-radius: 12px; overflow: hidden; border-left: 4px solid #2d9d78; }
        .dia-header { background: #2d9d78; color: white; padding: 15px; font-weight: 600; font-size: 1.05rem; }
        .dia-header small { display: block; font-weight: 400; font-size: 0.82rem; opacity: 0.9; margin-top: 4px; }
        .dia-content { padding: 15px; }
        .exercicio { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #444; }
        .exercicio:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .exercicio-nome { color: white; font-weight: 600; margin-bottom: 8px; }
        .exercicio-detalhes { color: #ccc; font-size: 0.88rem; display: flex; flex-wrap: wrap; gap: 15px; }
        .detalhe { display: flex; align-items: center; gap: 5px; }
        .detalhe-label { color: #999; }
        .detalhe-valor { color: #2d9d78; font-weight: 600; }
        .checkbox-exercicio { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-exercicio input { width: 20px; height: 20px; cursor: pointer; accent-color: #2d9d78; }
        .checkbox-exercicio label { color: #ccc; cursor: pointer; flex: 1; font-size: 0.9rem; }
        .btn-video { background: #e74c3c; color: white; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.82rem; font-weight: 600; white-space: nowrap; transition: background 0.2s ease; }
        .btn-video:hover { background: #c0392b; }
        .descanso-dia { background: #1a1f2e; border: 2px dashed #666; border-radius: 12px; padding: 30px; text-align: center; color: #999; }
        .descanso-dia h3 { color: #ccc; margin-top: 0; }
        .cardio-section { background: #2d3748; border-radius: 12px; padding: 25px; margin-bottom: 30px; border-left: 4px solid #ff8c42; }
        .cardio-section h2 { color: white; margin: 0 0 8px 0; font-size: 1.3rem; }
        .cardio-sub { color: #999; font-size: 0.9rem; margin-bottom: 20px; }
        .cardio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .cardio-item { background: #1a1f2e; border-radius: 8px; padding: 15px; }
        .cardio-nome { color: #ff8c42; font-weight: 700; margin-bottom: 8px; }
        .cardio-detalhe { color: #ccc; font-size: 0.87rem; line-height: 1.6; }
        .aviso-dados { background: #2d3748; border-left: 4px solid #e74c3c; padding: 20px; border-radius: 8px; color: #ccc; margin-bottom: 25px; }
        .aviso-dados strong { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="treino-container">
        <div class="treino-header">
            <h1>&#128170; Seu Treino Personalizado</h1>
            <a href="/dashboard.html" class="btn-voltar">&#8592; Voltar ao Dashboard</a>
        </div>

        <div class="fase-info">
            <div class="info-item">
                <div class="info-label">Objetivo</div>
                <div class="info-value" id="objetivoValue" style="font-size:1.1rem">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">N&iacute;vel</div>
                <div class="info-value" id="nivelValue" style="font-size:1.1rem">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Dias por Semana</div>
                <div class="info-value" id="diasValue">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Dura&ccedil;&atilde;o</div>
                <div class="info-value" id="tempoValue" style="font-size:1.1rem">-</div>
            </div>
        </div>

        <div id="localBadge"></div>
        <div id="treino-content"></div>
        <div id="cardio-content"></div>
    </div>

    <script>
        var usuario = null;
        try { usuario = JSON.parse(sessionStorage.getItem('usuario')); } catch (e) { usuario = null; }

        if (!usuario) {
            window.location.href = '/onboarding.html';
        }

        // ---------- NORMALIZACAO (resolve acentos e maiusculas) ----------
        function normalizar(txt) {
            if (!txt) return '';
            return String(txt).toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        function detectarObjetivo(txt) {
            var t = normalizar(txt);
            if (t.indexOf('emagrec') !== -1) return 'emagrecimento';
            if (t.indexOf('defin') !== -1) return 'definicao';
            if (t.indexOf('hipertrof') !== -1) return 'hipertrofia';
            return 'hipertrofia';
        }

        function detectarNivel(txt) {
            var t = normalizar(txt);
            if (t.indexOf('avanc') !== -1) return 'avancado';
            if (t.indexOf('interm') !== -1) return 'intermediario';
            return 'iniciante';
        }

        function detectarLocal(txt) {
            var t = normalizar(txt);
            if (t.indexOf('casa') !== -1 || t.indexOf('domicil') !== -1) return 'casa';
            return 'academia';
        }

        function detectarDias(valor) {
            var n = parseInt(valor, 10);
            if (isNaN(n)) return 3;
            if (n < 2) return 2;
            if (n > 6) return 6;
            return n;
        }

        function detectarTempo(txt) {
            var t = normalizar(txt);
            if (t.indexOf('30-45') !== -1 || t.indexOf('30 - 45') !== -1) return { label: '30-45 min', exercicios: 4 };
            if (t.indexOf('45-60') !== -1 || t.indexOf('45 - 60') !== -1) return { label: '45-60 min', exercicios: 6 };
            if (t.indexOf('60-90') !== -1 || t.indexOf('60 - 90') !== -1) return { label: '60-90 min', exercicios: 7 };
            if (t.indexOf('90') !== -1) return { label: '90+ min', exercicios: 8 };
            return { label: '45-60 min', exercicios: 6 };
        }

        // ---------- BANCO DE EXERCICIOS ----------
        var exerciciosDB = {
            academia: {
                peito: ['Supino Reto com Barra', 'Supino Inclinado com Halteres', 'Supino Declinado', 'Crucifixo com Halteres', 'Crossover na Polia', 'Peck Deck (Voador)', 'Supino Reto com Halteres', 'Flexão de Braço'],
                costas: ['Puxada Frontal Aberta', 'Remada Curvada com Barra', 'Remada Unilateral com Halter', 'Remada Baixa Sentado', 'Barra Fixa (ou Graviton)', 'Pulldown na Polia', 'Levantamento Terra', 'Remada Cavalinho'],
                pernas: ['Agachamento Livre', 'Leg Press 45°', 'Cadeira Extensora', 'Mesa Flexora', 'Afundo com Halteres', 'Agachamento Hack', 'Stiff com Barra', 'Cadeira Adutora'],
                ombros: ['Desenvolvimento Militar', 'Elevação Lateral com Halteres', 'Elevação Frontal', 'Crucifixo Inverso', 'Desenvolvimento Arnold', 'Remada Alta'],
                biceps: ['Rosca Direta com Barra', 'Rosca Alternada com Halteres', 'Rosca Scott', 'Rosca Martelo', 'Rosca Concentrada', 'Rosca na Polia Baixa'],
                triceps: ['Tríceps na Corda', 'Tríceps Testa com Barra W', 'Tríceps Francês', 'Mergulho no Banco', 'Tríceps Coice', 'Supino Fechado'],
                abdomen: ['Abdominal Supra no Solo', 'Prancha Isométrica', 'Elevação de Pernas', 'Abdominal Infra', 'Abdominal Oblíquo', 'Prancha Lateral'],
                gluteos: ['Elevação Pélvica com Barra', 'Cadeira Abdutora', 'Glúteo na Polia', 'Agachamento Sumô', 'Coice na Máquina'],
                panturrilha: ['Panturrilha em Pé na Máquina', 'Panturrilha Sentado', 'Panturrilha no Leg Press']
            },
            casa: {
                peito: ['Flexão de Braço Tradicional', 'Flexão Inclinada (mãos na cadeira)', 'Flexão Declinada (pés na cadeira)', 'Flexão Diamante', 'Flexão com Mochila nas Costas', 'Flexão Aberta', 'Crucifixo no Solo com Garrafas'],
                costas: ['Remada Curvada com Mochila', 'Remada Unilateral com Galão de Água', 'Superman no Solo', 'Remada Australiana (sob a mesa)', 'Pullover com Garrafa de 2L', 'Levantamento Terra com Mochila', 'Remada com Toalha na Porta'],
                pernas: ['Agachamento Livre (peso do corpo)', 'Agachamento com Mochila Carregada', 'Afundo Alternado', 'Agachamento Búlgaro (pé na cadeira)', 'Cadeira na Parede (isometria)', 'Stiff com Galões de Água', 'Passada Caminhando', 'Agachamento Sumô com Galão'],
                ombros: ['Desenvolvimento com Galões de Água', 'Elevação Lateral com Garrafas de 1L', 'Elevação Frontal com Mochila', 'Flexão Pike (pés elevados)', 'Remada Alta com Mochila', 'Crucifixo Inverso com Garrafas'],
                biceps: ['Rosca Direta com Galão de Água', 'Rosca Martelo com Garrafas', 'Rosca com Alça da Mochila', 'Rosca Concentrada com Garrafa', 'Rosca Isométrica com Toalha'],
                triceps: ['Mergulho na Cadeira', 'Tríceps Testa com Garrafa', 'Flexão Diamante', 'Tríceps Francês com Mochila', 'Tríceps Banco com Pés Elevados'],
                abdomen: ['Abdominal Supra no Solo', 'Prancha Isométrica', 'Elevação de Pernas', 'Abdominal Bicicleta', 'Prancha Lateral', 'Mountain Climber'],
                gluteos: ['Elevação Pélvica no Solo', 'Elevação Pélvica com Mochila', 'Coice de Glúteo (4 apoios)', 'Abdução Deitado de Lado', 'Agachamento Sumô', 'Ponte Unilateral'],
                panturrilha: ['Panturrilha em Pé no Degrau', 'Panturrilha com Mochila', 'Panturrilha Unilateral']
            }
        };

        // ---------- DIVISOES POR NUMERO DE DIAS ----------
        var divisoes = {
            2: [
                { nome: 'Corpo Inteiro A', grupos: ['peito', 'costas', 'pernas', 'abdomen'] },
                { nome: 'Corpo Inteiro B', grupos: ['ombros', 'pernas', 'biceps', 'triceps'] }
            ],
            3: [
                { nome: 'Peito, Ombros e Tríceps', grupos: ['peito', 'ombros', 'triceps'] },
                { nome: 'Costas, Bíceps e Abdômen', grupos: ['costas', 'biceps', 'abdomen'] },
                { nome: 'Pernas e Glúteos', grupos: ['pernas', 'gluteos', 'panturrilha'] }
            ],
            4: [
                { nome: 'Peito e Tríceps', grupos: ['peito', 'triceps'] },
                { nome: 'Costas e Bíceps', grupos: ['costas', 'biceps'] },
                { nome: 'Pernas e Panturrilha', grupos: ['pernas', 'panturrilha'] },
                { nome: 'Ombros e Abdômen', grupos: ['ombros', 'abdomen'] }
            ],
            5: [
                { nome: 'Peito', grupos: ['peito'] },
                { nome: 'Costas', grupos: ['costas'] },
                { nome: 'Pernas e Glúteos', grupos: ['pernas', 'gluteos'] },
                { nome: 'Ombros e Abdômen', grupos: ['ombros', 'abdomen'] },
                { nome: 'Bíceps e Tríceps', grupos: ['biceps', 'triceps'] }
            ],
            6: [
                { nome: 'Peito e Tríceps', grupos: ['peito', 'triceps'] },
                { nome: 'Costas e Bíceps', grupos: ['costas', 'biceps'] },
                { nome: 'Pernas e Panturrilha', grupos: ['pernas', 'panturrilha'] },
                { nome: 'Ombros e Abdômen', grupos: ['ombros', 'abdomen'] },
                { nome: 'Peito e Costas (volume)', grupos: ['peito', 'costas'] },
                { nome: 'Pernas e Glúteos', grupos: ['pernas', 'gluteos'] }
            ]
        };

        // ---------- DIAS DA SEMANA POR FREQUENCIA ----------
        var calendario = {
            2: ['Segunda', 'Quinta'],
            3: ['Segunda', 'Quarta', 'Sexta'],
            4: ['Segunda', 'Terça', 'Quinta', 'Sexta'],
            5: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'],
            6: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado']
        };

        // ---------- PARAMETROS POR NIVEL E OBJETIVO ----------
        var parametrosNivel = {
            iniciante:     { series: '3x', descansoExtra: 0 },
            intermediario: { series: '4x', descansoExtra: 0 },
            avancado:      { series: '4-5x', descansoExtra: 0 }
        };

        var parametrosObjetivo = {
            hipertrofia:   { reps: '8-12', descanso: '60-90s', cargaDica: 'Carga alta, falha entre 8 e 12 repetições' },
            definicao:     { reps: '12-15', descanso: '45-60s', cargaDica: 'Carga moderada, foco em contração e cadência' },
            emagrecimento: { reps: '15-20', descanso: '30-45s', cargaDica: 'Carga leve a moderada, ritmo contínuo' }
        };

        // ---------- CARDIO ----------
        var cardioDB = {
            academia: {
                hipertrofia: [
                    { nome: 'Esteira', detalhe: '15-20 min pós-treino • Velocidade 6-7 km/h • Inclinação 2-3%' },
                    { nome: 'Bicicleta Ergométrica', detalhe: '15-20 min • Ritmo leve e constante • Carga baixa' }
                ],
                definicao: [
                    { nome: 'Esteira', detalhe: '25-30 min pós-treino • Velocidade 8-10 km/h • Inclinação 4-6%' },
                    { nome: 'Bicicleta Ergométrica', detalhe: '25-30 min • Ritmo moderado • Carga média' },
                    { nome: 'Escada Ergométrica', detalhe: '15-20 min • Ritmo constante • Sem apoiar o peso nos braços' }
                ],
                emagrecimento: [
                    { nome: 'Esteira', detalhe: '35-40 min • Velocidade 9-12 km/h • Inclinação 5-8%' },
                    { nome: 'Bicicleta Ergométrica', detalhe: '30-40 min • Ritmo intenso • Carga alta' },
                    { nome: 'Escada Ergométrica', detalhe: '20-25 min • Ritmo acelerado' },
                    { nome: 'HIIT na Esteira', detalhe: '20 min • 30s forte / 60s leve • 2x por semana' }
                ]
            },
            casa: {
                hipertrofia: [
                    { nome: 'Caminhada na Rua', detalhe: '20-25 min • Ritmo confortável • Pós-treino ou dia de descanso' },
                    { nome: 'Polichinelo', detalhe: '4 séries de 60 segundos • 30s de descanso entre elas' }
                ],
                definicao: [
                    { nome: 'Corrida na Rua', detalhe: '25-30 min • Ritmo moderado • 3x por semana' },
                    { nome: 'Pular Corda', detalhe: '15-20 min • Alternando 2 min forte / 1 min leve' },
                    { nome: 'Mountain Climber', detalhe: '5 séries de 45 segundos • 30s de descanso' }
                ],
                emagrecimento: [
                    { nome: 'Corrida na Rua', detalhe: '35-40 min • Ritmo constante • 4x por semana' },
                    { nome: 'Pular Corda', detalhe: '20-25 min • Alternando 3 min forte / 1 min leve' },
                    { nome: 'Burpee', detalhe: '5 séries de 12 repetições • 45s de descanso' },
                    { nome: 'Circuito HIIT em Casa', detalhe: '20 min • Polichinelo + Mountain Climber + Agachamento + Burpee • 40s cada, 20s descanso' }
                ]
            }
        };

        // ---------- MONTAGEM DO TREINO ----------
        function montarExerciciosDoDia(grupos, local, totalExercicios) {
            var pool = exerciciosDB[local];
            var selecionados = [];
            var indices = {};
            grupos.forEach(function(g) { indices[g] = 0; });

            // distribui os exercicios entre os grupos, alternando
            var tentativas = 0;
            while (selecionados.length < totalExercicios && tentativas < 100) {
                for (var i = 0; i < grupos.length; i++) {
                    var grupo = grupos[i];
                    var lista = pool[grupo] || [];
                    if (indices[grupo] < lista.length && selecionados.length < totalExercicios) {
                        selecionados.push({ nome: lista[indices[grupo]], grupo: grupo });
                        indices[grupo]++;
                    }
                }
                tentativas++;
            }
            return selecionados;
        }

        function gerarTreino() {
            var objetivo = detectarObjetivo(usuario.objetivo);
            var nivel = detectarNivel(usuario.nivel);
            var dias = detectarDias(usuario.dias_treino);
            var tempo = detectarTempo(usuario.tempo_treino);
            var local = detectarLocal(usuario.local_treino || usuario.local || 'Academia');

            var pNivel = parametrosNivel[nivel];
            var pObjetivo = parametrosObjetivo[objetivo];

            // Cabecalho com os dados REAIS do aluno
            document.getElementById('objetivoValue').textContent = usuario.objetivo;
            document.getElementById('nivelValue').textContent = usuario.nivel;
            document.getElementById('diasValue').textContent = dias + ' dias';
            document.getElementById('tempoValue').textContent = tempo.label;

            // Badge do local
            var textoLocal = local === 'casa'
                ? '<strong>Treino em Casa</strong> — exercícios com peso do corpo e objetos do dia a dia (mochila carregada, galões de água, garrafas, cadeira e toalha).'
                : '<strong>Treino na Academia</strong> — exercícios com aparelhos, barras e halteres.';
            document.getElementById('localBadge').innerHTML = '<div class="local-badge">' + textoLocal + '</div>';

            // Divisao conforme os dias escolhidos
            var divisao = divisoes[dias];
            var diasAgenda = calendario[dias];
            var todosDias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];

            var container = document.getElementById('treino-content');
            container.innerHTML = '';

            var grid = document.createElement('div');
            grid.className = 'dias-semana';
            var htmlDias = '';

            todosDias.forEach(function(diaSemana, idxDia) {
                var posicao = diasAgenda.indexOf(diaSemana);

                if (posicao === -1) {
                    htmlDias += '' +
                        '<div class="descanso-dia">' +
                            '<h3>' + diaSemana + '</h3>' +
                            '<p>Dia de Descanso &#128564;</p>' +
                        '</div>';
                    return;
                }

                var treinoDoDia = divisao[posicao];
                var exercicios = montarExerciciosDoDia(treinoDoDia.grupos, local, tempo.exercicios);

                var htmlExercicios = '';
                exercicios.forEach(function(exc, i) {
                    var isAbdomen = (exc.grupo === 'abdomen');
                    var reps = isAbdomen ? '15-20' : pObjetivo.reps;
                    var descanso = isAbdomen ? '30-45s' : pObjetivo.descanso;

                    htmlExercicios += '' +
                        '<div class="exercicio">' +
                            '<div class="exercicio-nome">' + (i + 1) + '. ' + exc.nome + '</div>' +
                            '<div class="exercicio-detalhes">' +
                                '<div class="detalhe"><span class="detalhe-label">Séries:</span><span class="detalhe-valor">' + pNivel.series + '</span></div>' +
                                '<div class="detalhe"><span class="detalhe-label">Reps:</span><span class="detalhe-valor">' + reps + '</span></div>' +
                                '<div class="detalhe"><span class="detalhe-label">Descanso:</span><span class="detalhe-valor">' + descanso + '</span></div>' +
                            '</div>' +
                            '<div class="checkbox-exercicio">' +
                                '<input type="checkbox" id="exc-' + idxDia + '-' + i + '">' +
                                '<label for="exc-' + idxDia + '-' + i + '">Marcar como completo</label>' +
                                '<a class="btn-video" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(exc.nome + ' execução correta') + '" target="_blank" rel="noopener">&#9654; Ver execução</a>' +
                            '</div>' +
                        '</div>';
                });

                htmlDias += '' +
                    '<div class="dia-card">' +
                        '<div class="dia-header">&#127947; ' + diaSemana +
                            '<small>' + treinoDoDia.nome + ' &bull; ' + exercicios.length + ' exercícios &bull; ' + tempo.label + '</small>' +
                        '</div>' +
                        '<div class="dia-content">' + htmlExercicios + '</div>' +
                    '</div>';
            });

            grid.innerHTML = htmlDias;
            container.appendChild(grid);

            // ---------- CARDIO ----------
            var listaCardio = cardioDB[local][objetivo];
            var htmlCardio = '';
            listaCardio.forEach(function(c) {
                htmlCardio += '' +
                    '<div class="cardio-item">' +
                        '<div class="cardio-nome">' + c.nome + '</div>' +
                        '<div class="cardio-detalhe">' + c.detalhe + '</div>' +
                    '</div>';
            });

            document.getElementById('cardio-content').innerHTML = '' +
                '<div class="cardio-section">' +
                    '<h2>&#127939; Cardio</h2>' +
                    '<div class="cardio-sub">Protocolo ajustado para <strong>' + usuario.objetivo + '</strong> &bull; ' + (local === 'casa' ? 'Casa / Rua' : 'Academia') + '</div>' +
                    '<div class="cardio-grid">' + htmlCardio + '</div>' +
                '</div>';
        }

        gerarTreino();
    </script>
</body>
</html>
