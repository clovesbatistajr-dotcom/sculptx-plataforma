<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Treino - SculptX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .treino-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1f2e;
            min-height: 100vh;
        }

        .treino-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .treino-header h1 {
            color: white;
            font-size: 2rem;
            margin: 0;
        }

        .btn-voltar {
            background: #2d9d78;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-voltar:hover {
            background: #1e7a5e;
        }

        .fase-info {
            background: #2d3748;
            border: 2px solid #2d9d78;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: #999;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .info-value {
            color: #2d9d78;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .dias-semana {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dia-card {
            background: #2d3748;
            border-radius: 12px;
            overflow: hidden;
            border-left: 4px solid #2d9d78;
        }

        .dia-header {
            background: #2d9d78;
            color: white;
            padding: 15px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .dia-content {
            padding: 15px;
        }

        .exercicio {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .exercicio:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .exercicio-nome {
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .exercicio-detalhes {
            color: #ccc;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .detalhe {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detalhe-label {
            color: #999;
        }

        .detalhe-valor {
            color: #2d9d78;
            font-weight: 600;
        }

        .checkbox-exercicio {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-exercicio input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2d9d78;
        }

        .checkbox-exercicio label {
            color: #ccc;
            cursor: pointer;
            flex: 1;
        }

        .descanso-dia {
            background: #1a1f2e;
            border: 2px dashed #666;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #999;
        }

        .descanso-dia h3 {
            color: #ccc;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="treino-container">
        <div class="treino-header">
            <h1>💪 Seu Treino Personalizado</h1>
            <a href="/dashboard.html" class="btn-voltar">← Voltar ao Dashboard</a>
        </div>

        <div class="fase-info">
            <div class="info-item">
                <div class="info-label">Fase Atual</div>
                <div class="info-value" id="faseValue">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Total de Fases</div>
                <div class="info-value">30</div>
            </div>
            <div class="info-item">
                <div class="info-label">Dias por Semana</div>
                <div class="info-value" id="diasValue">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Próxima Progressão</div>
                <div class="info-value">60 dias</div>
            </div>
        </div>

        <div id="treino-content"></div>
    </div>

    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        
        if (!usuario) {
            window.location.href = '/onboarding.html';
        }

        // Dados de treino padrão por objetivo e nível
        const treinoData = {
            hipertrofia: {
                iniciante: {
                    diasSemana: 3,
                    divisao: {
                        'Segunda': ['Supino Inclinado', 'Supino Reto', 'Rosca Direta', 'Tríceps Corda'],
                        'Quarta': ['Agachamento', 'Leg Press', 'Cadeira Extensora', 'Rosca Direta'],
                        'Sexta': ['Puxada Frontal', 'Remada Unilateral', 'Encolhimento', 'Rosca Inversa']
                    }
                },
                intermediario: {
                    diasSemana: 4,
                    divisao: {
                        'Segunda': ['Supino Inclinado', 'Supino Reto', 'Crucifixo', 'Rosca Direta', 'Rosca Scott'],
                        'Terça': ['Agachamento', 'Leg Press', 'Cadeira Extensora', 'Leg Curl', 'Panturrilha'],
                        'Quinta': ['Puxada Frontal', 'Remada Inclinada', 'Remada Unilateral', 'Encolhimento'],
                        'Sábado': ['Desenvolvimento Militar', 'Lateral Máquina', 'Rosca Inversa', 'Tríceps Corda', 'Crucifixo Peck Deck']
                    }
                }
            },
            definição: {
                iniciante: {
                    diasSemana: 4,
                    divisao: {
                        'Segunda': ['Supino Reto', 'Rosca Direta', 'Tríceps Corda', 'Abdominais'],
                        'Terça': ['Agachamento', 'Leg Press', 'Leg Curl'],
                        'Quinta': ['Puxada Frontal', 'Remada Inclinada', 'Encolhimento'],
                        'Sábado': ['Desenvolvimento', 'Lateral Máquina', 'Rosca Inversa', 'Abdominais']
                    }
                },
                intermediario: {
                    diasSemana: 5,
                    divisao: {
                        'Segunda': ['Supino Inclinado', 'Supino Reto', 'Rosca Direta', 'Rosca Scott', 'Tríceps Corda'],
                        'Terça': ['Agachamento', 'Leg Press', 'Cadeira Extensora', 'Leg Curl', 'Panturrilha'],
                        'Quarta': ['Abdominais', 'Esteira', 'Bicicleta Ergométrica'],
                        'Quinta': ['Puxada Frontal', 'Remada Inclinada', 'Remada Unilateral', 'Encolhimento', 'Rosca Inversa'],
                        'Sábado': ['Desenvolvimento Militar', 'Lateral Máquina', 'Crucifixo Peck Deck']
                    }
                }
            }
        };

        function gerarTreino() {
            const objetivo = usuario.objetivo.toLowerCase();
            const nivel = usuario.nivel.toLowerCase();
            const diasTreino = usuario.dias_treino;

            let treino = treinoData[objetivo]?.[nivel] || treinoData['hipertrofia']['iniciante'];
            
            document.getElementById('diasValue').textContent = treino.diasSemana + ' dias';

            const container = document.getElementById('treino-content');
            container.innerHTML = '';

            const diasDaSemana = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
            const diasDisponiveis = Object.keys(treino.divisao);

            diasDaSemana.forEach((dia, index) => {
                let html = '';

                if (diasDisponiveis.includes(dia)) {
                    const exercicios = treino.divisao[dia];
                    html = `
                        <div class="dia-card">
                            <div class="dia-header">🏋️ ${dia}</div>
                            <div class="dia-content">
                                ${exercicios.map((exc, i) => {
                                    const series = Math.floor(Math.random() * 2) + 3; // 3-4 séries
                                    const reps = objetivo === 'hipertrofia' ? '8-12' : '12-15';
                                    const descanso = '60-90s';
                                    return `
                                        <div class="exercicio">
                                            <div class="exercicio-nome">${i + 1}. ${exc}</div>
                                            <div class="exercicio-detalhes">
                                                <div class="detalhe">
                                                    <span class="detalhe-label">Séries:</span>
                                                    <span class="detalhe-valor">${series}x</span>
                                                </div>
                                                <div class="detalhe">
                                                    <span class="detalhe-label">Reps:</span>
                                                    <span class="detalhe-valor">${reps}</span>
                                                </div>
                                                <div class="detalhe">
                                                    <span class="detalhe-label">Descanso:</span>
                                                    <span class="detalhe-valor">${descanso}</span>
                                                </div>
                                            </div>
                                            <div class="checkbox-exercicio">
                                                <input type="checkbox" id="exc-${index}-${i}">
                                                <label for="exc-${index}-${i}">Marcar como completo</label>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="descanso-dia">
                            <h3>${dia}</h3>
                            <p>Dia de Descanso 🛌</p>
                        </div>
                    `;
                }

                const diasContainer = document.createElement('div');
                diasContainer.className = 'dias-semana';
                diasContainer.innerHTML = html;
                container.appendChild(diasContainer);
            });
        }

        gerarTreino();
    </script>
</body>
</html>
