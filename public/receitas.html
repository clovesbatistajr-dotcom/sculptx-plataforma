<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas Fit - SculptX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .receitas-container { max-width: 1400px; margin: 0 auto; padding: 20px; background: #1a1f2e; min-height: 100vh; }
        .receitas-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .receitas-header h1 { color: white; font-size: 2rem; margin: 0; }
        .btn-voltar { background: #2d9d78; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-voltar:hover { background: #1e7a5e; }
        .busca-wrapper { margin-bottom: 20px; }
        .busca-input { width: 100%; padding: 14px 18px; background: #2d3748; border: 2px solid #444; border-radius: 8px; color: white; font-size: 1rem; }
        .busca-input:focus { outline: none; border-color: #2d9d78; }
        .busca-input::placeholder { color: #888; }
        .filtros-receitas { display: flex; gap: 12px; margin-bottom: 35px; flex-wrap: wrap; }
        .filtro-receita-btn { padding: 12px 24px; background: #2d3748; color: #ccc; border: 2px solid #444; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .filtro-receita-btn.ativo { background: #2d9d78; color: white; border-color: #2d9d78; }
        .filtro-receita-btn:hover { border-color: #2d9d78; }
        .receitas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .receita-card { background: #2d3748; border-radius: 12px; overflow: hidden; border: 2px solid #444; transition: all 0.3s ease; cursor: pointer; }
        .receita-card:hover { border-color: #2d9d78; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(45, 157, 120, 0.2); }
        .receita-header { background: linear-gradient(135deg, #2d9d78, #1e7a5e); color: white; padding: 20px; text-align: center; }
        .receita-emoji { font-size: 2.5rem; margin-bottom: 10px; }
        .receita-nome { font-size: 1.15rem; font-weight: 700; margin-bottom: 5px; }
        .receita-tempo { font-size: 0.85rem; opacity: 0.9; }
        .receita-content { padding: 20px; }
        .receita-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1a1f2e; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .macro-receita { color: #999; font-size: 0.72rem; margin-bottom: 5px; }
        .macro-valor-receita { color: #2d9d78; font-weight: 700; font-size: 1rem; }
        .receita-ingredientes { margin-bottom: 20px; }
        .receita-titulo { color: #2d9d78; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 10px; }
        .ingredientes-lista { list-style: none; padding: 0; margin: 0; }
        .ingredientes-lista li { color: #ccc; font-size: 0.88rem; padding: 6px 0; border-bottom: 1px solid #444; }
        .ingredientes-lista li:last-child { border-bottom: none; }
        .ingredientes-lista li:before { content: "\2713 "; color: #2d9d78; font-weight: bold; margin-right: 8px; }
        .mais-ingredientes { color: #888; font-size: 0.82rem; font-style: italic; padding-top: 8px; }
        .btn-ver-preparo { width: 100%; background: #2d9d78; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-ver-preparo:hover { background: #1e7a5e; }
        .modal-receita { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .modal-receita.ativo { display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
        .modal-content-receita { background: #2d3748; border-radius: 12px; padding: 35px; max-width: 700px; width: 100%; border: 2px solid #2d9d78; }
        .modal-header-receita { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; border-bottom: 2px solid #2d9d78; padding-bottom: 18px; gap: 15px; }
        .modal-titulo-receita { color: white; font-size: 1.4rem; font-weight: 700; margin: 0; }
        .modal-sub { color: #999; font-size: 0.85rem; margin-top: 6px; }
        .btn-fechar { background: none; border: none; color: #999; font-size: 1.6rem; cursor: pointer; line-height: 1; }
        .btn-fechar:hover { color: #2d9d78; }
        .modal-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #1a1f2e; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: center; }
        .modo-preparo { color: #ccc; line-height: 1.75; }
        .modo-preparo h3 { color: #2d9d78; margin: 0 0 14px 0; font-size: 1rem; text-transform: uppercase; }
        .modo-preparo ul, .modo-preparo ol { margin: 0 0 25px 0; padding-left: 22px; }
        .modo-preparo li { margin-bottom: 12px; color: #ccc; }
        .dica-preparo { background: #1a1f2e; border-left: 4px solid #ffd93d; padding: 15px; margin-top: 10px; border-radius: 6px; color: #ccc; }
        .categoria-titulo { color: white; font-size: 1.4rem; font-weight: 700; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid #2d9d78; }
        .sem-resultado { color: #999; text-align: center; padding: 50px 20px; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="receitas-container">
        <div class="receitas-header">
            <h1>&#127859; Receitas Fit</h1>
            <a href="/dashboard.html" class="btn-voltar">&#8592; Voltar ao Dashboard</a>
        </div>

        <div class="busca-wrapper">
            <input type="text" id="buscaReceita" class="busca-input" placeholder="&#128269; Buscar receita ou ingrediente..." oninput="buscarReceitas()">
        </div>

        <div class="filtros-receitas">
            <button class="filtro-receita-btn ativo" data-filtro="todas" onclick="filtrarReceitas('todas', this)">Todas (80)</button>
            <button class="filtro-receita-btn" data-filtro="low-carb" onclick="filtrarReceitas('low-carb', this)">Low Carb (20)</button>
            <button class="filtro-receita-btn" data-filtro="proteicas" onclick="filtrarReceitas('proteicas', this)">Prote&iacute;cas (20)</button>
            <button class="filtro-receita-btn" data-filtro="zero-lactose" onclick="filtrarReceitas('zero-lactose', this)">Zero Lactose (20)</button>
            <button class="filtro-receita-btn" data-filtro="doce-fit" onclick="filtrarReceitas('doce-fit', this)">Doce Fit (20)</button>
        </div>

        <div id="receitasContainer"></div>
    </div>

    <div class="modal-receita" id="modalReceita">
        <div class="modal-content-receita">
            <div class="modal-header-receita">
                <div>
                    <h2 class="modal-titulo-receita" id="modalTitulo">Receita</h2>
                    <div class="modal-sub" id="modalSub"></div>
                </div>
                <button class="btn-fechar" onclick="fecharModal()">&#10005;</button>
            </div>
            <div class="modal-macros" id="modalMacros"></div>
            <div class="modo-preparo" id="modoPreparo"></div>
            <div class="dica-preparo" id="dicaPreparo"></div>
        </div>
    </div>

    <script>
        const receitas = {
            'low-carb': [
                { nome: 'Brownie Low Carb', emoji: '\u{1F36B}', tempo: '25 min', porcoes: '6 porções', calorias: 185, proteina: 6, carbo: 4, gordura: 16, ingredientes: ['Chocolate 70% (80g)', 'Manteiga sem sal (50g)', 'Ovos (3)', 'Farinha de amêndoas (40g)', 'Cacau em pó 100% (2 col. sopa)', 'Adoçante culinário (60g)', 'Fermento em pó (1/2 col. chá)', 'Pitada de sal'], preparo: ['Pré-aqueça o forno a 180°C e unte uma forma pequena (20x20cm).', 'Derreta o chocolate com a manteiga em banho-maria ou micro-ondas (30s por vez, mexendo).', 'Em outra tigela, bata os ovos com o adoçante por 2 minutos até clarear.', 'Junte o chocolate derretido morno aos ovos, mexendo devagar para não cozinhar.', 'Incorpore a farinha de amêndoas, o cacau, o fermento e o sal com espátula.', 'Despeje na forma e asse por 18-20 minutos — o centro deve ficar levemente úmido.', 'Espere esfriar completamente antes de cortar (isso firma a textura).'], dica: '&#128161; <strong>Ponto certo:</strong> palito sai com migalhas úmidas, não seco. Se assar demais vira bolo, não brownie.' },
                { nome: 'Panqueca Low Carb de Queijo', emoji: '\u{1F95E}', tempo: '10 min', porcoes: '1 porção', calorias: 240, proteina: 18, carbo: 3, gordura: 17, ingredientes: ['Ovos (2)', 'Queijo meia-cura ralado (40g)', 'Creme de leite (1 col. sopa)', 'Canela ou orégano a gosto', 'Manteiga para untar'], preparo: ['Bata os ovos com o creme de leite até homogeneizar.', 'Misture o queijo ralado e o tempero escolhido.', 'Aqueça uma frigideira antiaderente em fogo médio-baixo com um fio de manteiga.', 'Despeje a massa e espalhe formando um disco fino.', 'Cozinhe por 2-3 minutos até as bordas soltarem, vire com cuidado.', 'Cozinhe mais 1-2 minutos e sirva quente.'], dica: '&#128161; <strong>Versão doce:</strong> canela + adoçante. <strong>Salgada:</strong> orégano + recheio de frango desfiado.' },
                { nome: 'Espaguete de Abobrinha com Frango', emoji: '\u{1F35D}', tempo: '20 min', porcoes: '1 porção', calorias: 310, proteina: 34, carbo: 9, gordura: 14, ingredientes: ['Abobrinha média (300g)', 'Peito de frango em cubos (150g)', 'Tomate cereja (100g)', 'Alho (2 dentes)', 'Azeite (1 col. sopa)', 'Sal, pimenta e manjericão'], preparo: ['Corte a abobrinha em fios com espiralizador ou descascador (fatias finas).', 'Tempere o frango com sal e pimenta e grelhe no azeite até dourar. Reserve.', 'Na mesma frigideira, refogue o alho até perfumar.', 'Junte os tomates cereja cortados ao meio e cozinhe 3 minutos.', 'Adicione a abobrinha e salteie por apenas 2-3 minutos — ela deve ficar al dente.', 'Volte o frango, finalize com manjericão e sirva imediatamente.'], dica: '&#128161; <strong>Evite o "molhado":</strong> salgue a abobrinha, deixe 10 min e esprema antes de cozinhar.' },
                { nome: 'Torta de Frango Low Carb', emoji: '\u{1F357}', tempo: '45 min', porcoes: '4 porções', calorias: 295, proteina: 32, carbo: 5, gordura: 16, ingredientes: ['Frango desfiado cozido (300g)', 'Ovos (4)', 'Requeijão light (3 col. sopa)', 'Queijo mussarela ralado (60g)', 'Cebola picada (1/2)', 'Alho (2 dentes)', 'Azeite, sal, pimenta e salsinha'], preparo: ['Pré-aqueça o forno a 180°C.', 'Refogue a cebola e o alho no azeite até dourarem.', 'Junte o frango desfiado, tempere e refogue por 5 minutos. Deixe amornar.', 'Bata os ovos com o requeijão até ficar homogêneo.', 'Misture o frango refogado à mistura de ovos e acrescente a salsinha.', 'Despeje em forma untada, cubra com a mussarela.', 'Asse por 30 minutos até dourar e firmar no centro.'], dica: '&#128161; <strong>Meal prep:</strong> corte em porções e congele — dura 30 dias e esquenta direto no forno.' },
                { nome: 'Pizza Low Carb de Frigideira', emoji: '\u{1F355}', tempo: '20 min', porcoes: '1 porção', calorias: 380, proteina: 30, carbo: 7, gordura: 26, ingredientes: ['Ovos (3)', 'Farinha de amêndoas (2 col. sopa)', 'Molho de tomate sem açúcar (3 col. sopa)', 'Mussarela (70g)', 'Frango desfiado (80g)', 'Orégano e azeite'], preparo: ['Bata os ovos com a farinha de amêndoas e uma pitada de sal.', 'Aqueça uma frigideira antiaderente com azeite em fogo baixo.', 'Despeje a massa e tampe. Cozinhe 4-5 minutos até firmar por completo.', 'Espalhe o molho de tomate sobre a massa ainda na frigideira.', 'Cubra com o frango e a mussarela, tampe novamente.', 'Cozinhe até o queijo derreter (3-4 min), finalize com orégano.'], dica: '&#128161; <strong>Fogo baixo é essencial</strong> — no fogo alto a massa queima embaixo e fica crua em cima.' },
                { nome: 'Mousse de Abacate com Cacau', emoji: '\u{1F951}', tempo: '10 min', porcoes: '2 porções', calorias: 215, proteina: 4, carbo: 6, gordura: 19, ingredientes: ['Abacate maduro (1 pequeno, ~150g de polpa)', 'Cacau em pó 100% (2 col. sopa)', 'Leite de coco (60ml)', 'Adoçante a gosto', 'Essência de baunilha (1 col. chá)', 'Pitada de sal'], preparo: ['Retire a polpa do abacate e coloque no liquidificador ou processador.', 'Adicione o cacau, o leite de coco, a baunilha, o sal e o adoçante.', 'Bata até obter um creme completamente liso — raspe as laterais e bata de novo.', 'Prove e ajuste o adoçante.', 'Distribua em taças e leve à geladeira por 1 hora antes de servir.'], dica: '&#128161; <strong>Abacate no ponto:</strong> cede à pressão leve do dedo. Verde demais deixa gosto amargo.' },
                { nome: 'Bolo de Coco Low Carb', emoji: '\u{1F965}', tempo: '40 min', porcoes: '8 porções', calorias: 195, proteina: 6, carbo: 5, gordura: 17, ingredientes: ['Coco ralado sem açúcar (100g)', 'Farinha de amêndoas (80g)', 'Ovos (4)', 'Manteiga derretida (60g)', 'Leite de coco (100ml)', 'Adoçante culinário (80g)', 'Fermento em pó (1 col. chá)'], preparo: ['Pré-aqueça o forno a 180°C e unte uma forma média.', 'Bata os ovos com o adoçante por 3 minutos até ficarem fofos.', 'Adicione a manteiga derretida morna e o leite de coco, batendo em velocidade baixa.', 'Incorpore o coco ralado e a farinha de amêndoas com espátula.', 'Por último, misture o fermento delicadamente.', 'Asse por 30-35 minutos até dourar e o palito sair limpo.'], dica: '&#128161; <strong>Atenção ao coco:</strong> use o sem açúcar. O tradicional de supermercado costuma vir adoçado.' },
                { nome: 'Torta de Espinafre Low Carb', emoji: '\u{1F96C}', tempo: '45 min', porcoes: '4 porções', calorias: 250, proteina: 18, carbo: 6, gordura: 17, ingredientes: ['Espinafre fresco (300g)', 'Ovos (4)', 'Ricota amassada (150g)', 'Cebola picada (1/2)', 'Alho (2 dentes)', 'Queijo parmesão ralado (30g)', 'Azeite, sal, pimenta e noz-moscada'], preparo: ['Pré-aqueça o forno a 180°C.', 'Refogue a cebola e o alho no azeite, junte o espinafre e cozinhe até murchar.', 'Escorra bem o excesso de líquido — isso evita que a torta fique aguada.', 'Bata os ovos e misture com a ricota, o parmesão e os temperos.', 'Junte o espinafre refogado e misture.', 'Despeje em forma untada e asse por 30 minutos até firmar e dourar.'], dica: '&#128161; <strong>Noz-moscada</strong> é o que faz a diferença aqui — só uma pitada transforma o sabor.' },
                { nome: 'Cheesecake Low Carb', emoji: '\u{1F370}', tempo: '50 min + 4h gelar', porcoes: '8 porções', calorias: 285, proteina: 8, carbo: 6, gordura: 26, ingredientes: ['BASE: Farinha de amêndoas (100g)', 'BASE: Manteiga derretida (50g)', 'BASE: Adoçante (20g)', 'RECHEIO: Cream cheese (400g)', 'RECHEIO: Ovos (3)', 'RECHEIO: Adoçante culinário (100g)', 'RECHEIO: Suco de 1/2 limão', 'RECHEIO: Essência de baunilha'], preparo: ['Misture os ingredientes da base e pressione no fundo de uma forma de fundo removível.', 'Leve ao forno a 180°C por 10 minutos e reserve para esfriar.', 'Bata o cream cheese com o adoçante até ficar liso (não bata demais).', 'Adicione os ovos um a um, em velocidade baixa, depois o limão e a baunilha.', 'Despeje sobre a base e asse a 160°C por 35-40 minutos.', 'O centro deve tremer levemente ao balançar a forma.', 'Deixe esfriar dentro do forno desligado com a porta entreaberta, depois gele por 4 horas.'], dica: '&#128161; <strong>Sem rachaduras:</strong> não bata em velocidade alta e resfrie devagar. Choque térmico racha a superfície.' },
                { nome: 'Pão de Queijo Low Carb', emoji: '\u{1F9C0}', tempo: '30 min', porcoes: '10 unidades', calorias: 95, proteina: 5, carbo: 2, gordura: 8, ingredientes: ['Farinha de amêndoas (100g)', 'Queijo parmesão ralado (80g)', 'Ovo (1)', 'Manteiga derretida (30g)', 'Fermento em pó (1/2 col. chá)', 'Sal a gosto'], preparo: ['Pré-aqueça o forno a 180°C.', 'Misture a farinha de amêndoas, o parmesão, o fermento e o sal.', 'Adicione o ovo e a manteiga derretida e amasse até formar uma massa homogênea.', 'Se estiver muito seca, adicione 1 colher de água morna.', 'Faça bolinhas com as mãos levemente untadas.', 'Asse por 18-20 minutos até dourarem por fora.'], dica: '&#128161; Melhores quentinhos. Congele crus e asse direto do freezer (+5 min).' },
                { nome: 'Muffin de Ovo com Bacon', emoji: '\u{1F95A}', tempo: '30 min', porcoes: '6 unidades', calorias: 130, proteina: 11, carbo: 2, gordura: 9, ingredientes: ['Ovos (6)', 'Bacon em cubos (80g)', 'Queijo ralado (50g)', 'Cebolinha picada', 'Pimentão picado (1/2)', 'Sal e pimenta'], preparo: ['Pré-aqueça o forno a 180°C e unte forminhas de muffin.', 'Frite o bacon até ficar crocante e escorra a gordura.', 'Bata os ovos com sal e pimenta.', 'Misture o bacon, o queijo, o pimentão e a cebolinha aos ovos.', 'Distribua nas forminhas até 3/4 da altura (eles crescem).', 'Asse por 18-20 minutos até firmarem e dourarem.'], dica: '&#128161; <strong>Café da manhã da semana:</strong> faça 12 no domingo e guarde na geladeira por até 5 dias.' },
                { nome: 'Almôndegas ao Molho Low Carb', emoji: '\u{1F356}', tempo: '35 min', porcoes: '3 porções', calorias: 320, proteina: 35, carbo: 8, gordura: 16, ingredientes: ['Carne moída patinho (400g)', 'Ovo (1)', 'Farinha de amêndoas (2 col. sopa)', 'Alho (2 dentes)', 'Molho de tomate sem açúcar (300ml)', 'Cebola (1/2)', 'Azeite, sal, pimenta e orégano'], preparo: ['Misture a carne com o ovo, a farinha de amêndoas, metade do alho, sal e pimenta.', 'Sove a mistura com as mãos por 2 minutos — isso dá liga.', 'Modele bolinhas de tamanho uniforme (cerca de 12).', 'Doure as almôndegas no azeite em fogo médio, virando para selar todos os lados.', 'Retire, refogue a cebola e o alho restante na mesma panela.', 'Adicione o molho, volte as almôndegas e cozinhe tampado por 15 minutos.', 'Finalize com orégano.'], dica: '&#128161; <strong>Selar antes</strong> mantém as almôndegas inteiras e concentra o sabor no molho.' },
                { nome: 'Salmão com Aspargos na Manteiga', emoji: '\u{1F41F}', tempo: '20 min', porcoes: '1 porção', calorias: 420, proteina: 36, carbo: 5, gordura: 28, ingredientes: ['Filé de salmão (180g)', 'Aspargos frescos (150g)', 'Manteiga (2 col. sopa)', 'Alho (2 dentes)', 'Suco de 1/2 limão', 'Sal, pimenta e endro (dill)'], preparo: ['Seque bem o salmão com papel-toalha e tempere com sal e pimenta.', 'Aqueça uma frigideira em fogo médio-alto com metade da manteiga.', 'Coloque o salmão com a pele para baixo e não mexa por 4 minutos.', 'Vire e cozinhe mais 3 minutos. Retire e reserve.', 'Na mesma frigideira, derreta o restante da manteiga com o alho.', 'Salteie os aspargos por 4-5 minutos até ficarem al dente e vibrantes.', 'Regue tudo com o limão e finalize com endro.'], dica: '&#128161; <strong>Pele crocante:</strong> salmão bem seco + frigideira quente + não mexer nos primeiros minutos.' },
                { nome: 'Nuggets de Frango Low Carb', emoji: '\u{1F357}', tempo: '30 min', porcoes: '3 porções', calorias: 260, proteina: 34, carbo: 4, gordura: 11, ingredientes: ['Peito de frango em cubos (400g)', 'Ovo (1)', 'Farinha de amêndoas (80g)', 'Parmesão ralado (40g)', 'Páprica defumada (1 col. chá)', 'Alho em pó, sal e pimenta', 'Azeite em spray'], preparo: ['Pré-aqueça o forno a 200°C e forre uma assadeira com papel-manteiga.', 'Tempere os cubos de frango com sal, pimenta e alho em pó.', 'Bata o ovo em um prato fundo.', 'Em outro prato, misture a farinha de amêndoas, o parmesão e a páprica.', 'Passe cada pedaço no ovo e depois na farinha, pressionando para aderir.', 'Disponha na assadeira sem encostar um no outro e borrife azeite.', 'Asse por 20 minutos, virando na metade do tempo.'], dica: '&#128161; <strong>Air fryer:</strong> 200°C por 12-14 minutos, chacoalhando na metade. Fica mais crocante.' },
                { nome: 'Strogonoff de Frango Low Carb', emoji: '\u{1F372}', tempo: '30 min', porcoes: '3 porções', calorias: 350, proteina: 33, carbo: 7, gordura: 21, ingredientes: ['Peito de frango em tiras (400g)', 'Creme de leite fresco (200ml)', 'Champignon fatiado (150g)', 'Cebola (1/2)', 'Alho (2 dentes)', 'Mostarda Dijon (1 col. sopa)', 'Extrato de tomate (1 col. sopa)', 'Manteiga, sal e pimenta'], preparo: ['Tempere o frango com sal e pimenta.', 'Doure o frango na manteiga em fogo alto, em duas levas para não soltar água. Reserve.', 'Refogue a cebola e o alho na mesma panela.', 'Junte o champignon e refogue até dourar.', 'Adicione a mostarda e o extrato de tomate, mexendo por 1 minuto.', 'Volte o frango, abaixe o fogo e incorpore o creme de leite.', 'Aqueça sem ferver por 3 minutos e ajuste o sal.'], dica: '&#128161; <strong>Nunca ferva o creme de leite</strong> — ele talha. Fogo baixo e desligue assim que engrossar.' },
                { nome: 'Bolinho de Atum Low Carb', emoji: '\u{1F41F}', tempo: '25 min', porcoes: '8 unidades', calorias: 85, proteina: 9, carbo: 2, gordura: 4, ingredientes: ['Atum em água escorrido (2 latas)', 'Ovos (2)', 'Farinha de amêndoas (50g)', 'Cebola picada bem fina (1/2)', 'Salsinha e cebolinha', 'Suco de 1/2 limão', 'Sal e pimenta'], preparo: ['Pré-aqueça o forno a 190°C.', 'Escorra muito bem o atum, apertando com um garfo.', 'Misture o atum com os ovos, a farinha de amêndoas e a cebola.', 'Adicione os temperos verdes, o limão, o sal e a pimenta.', 'Modele bolinhos e disponha em assadeira forrada.', 'Asse por 18-20 minutos até dourarem.'], dica: '&#128161; <strong>Atum bem escorrido</strong> é o segredo — úmido demais, o bolinho desmancha.' },
                { nome: 'Omelete Recheado de Frango', emoji: '\u{1F373}', tempo: '15 min', porcoes: '1 porção', calorias: 340, proteina: 33, carbo: 4, gordura: 21, ingredientes: ['Ovos (3)', 'Frango desfiado (80g)', 'Queijo mussarela (30g)', 'Tomate picado (1/2)', 'Cebolinha', 'Manteiga, sal e pimenta'], preparo: ['Bata os ovos com sal e pimenta até homogeneizar bem.', 'Aqueça a frigideira em fogo médio-baixo com manteiga.', 'Despeje os ovos e, com a espátula, puxe as bordas para o centro nos primeiros 30 segundos.', 'Quando a superfície estiver quase firme, distribua o frango, o queijo e o tomate em metade do omelete.', 'Dobre ao meio com a espátula e cozinhe mais 1 minuto.', 'Finalize com cebolinha e sirva imediatamente.'], dica: '&#128161; <strong>Omelete macio:</strong> fogo baixo sempre. Fogo alto deixa borrachudo e seco.' },
                { nome: 'Sopa Cremosa de Couve-Flor', emoji: '\u{1F963}', tempo: '30 min', porcoes: '3 porções', calorias: 165, proteina: 7, carbo: 9, gordura: 11, ingredientes: ['Couve-flor (1 cabeça média)', 'Creme de leite (100ml)', 'Caldo de legumes (500ml)', 'Cebola (1/2)', 'Alho (3 dentes)', 'Azeite, sal, pimenta e noz-moscada', 'Queijo parmesão para finalizar'], preparo: ['Corte a couve-flor em floretes.', 'Refogue a cebola e o alho no azeite até ficarem transparentes.', 'Junte a couve-flor e o caldo, e cozinhe por 15 minutos até amaciar bem.', 'Bata tudo no liquidificador até ficar completamente liso.', 'Volte à panela, adicione o creme de leite e aqueça sem ferver.', 'Tempere com sal, pimenta e noz-moscada.', 'Sirva com parmesão ralado por cima.'], dica: '&#128161; <strong>Textura aveludada:</strong> bata por 2 minutos completos no liquidificador, não menos.' },
                { nome: 'Wrap de Couve-Flor', emoji: '\u{1F32F}', tempo: '35 min', porcoes: '4 unidades', calorias: 110, proteina: 8, carbo: 6, gordura: 6, ingredientes: ['Couve-flor crua ralada (400g)', 'Ovos (2)', 'Queijo parmesão (40g)', 'Orégano, sal e pimenta'], preparo: ['Pré-aqueça o forno a 200°C e forre uma assadeira com papel-manteiga.', 'Rale a couve-flor crua no ralo fino (ou processe até virar "arroz").', 'Cozinhe no micro-ondas por 4 minutos e deixe esfriar.', 'ESSENCIAL: coloque em um pano limpo e torça até tirar toda a água possível.', 'Misture com os ovos, o parmesão e os temperos.', 'Espalhe em discos finos na assadeira e asse 15 minutos.', 'Vire e asse mais 5 minutos até secarem nas bordas.'], dica: '&#128161; <strong>Torcer bem é tudo.</strong> Água na massa = wrap que rasga na hora de enrolar.' },
                { nome: 'Picolé de Coco com Chocolate', emoji: '\u{1F366}', tempo: '10 min + 4h congelar', porcoes: '6 unidades', calorias: 145, proteina: 2, carbo: 4, gordura: 14, ingredientes: ['Leite de coco (400ml)', 'Coco ralado sem açúcar (40g)', 'Adoçante a gosto', 'Chocolate 70% (60g)', 'Óleo de coco (1 col. sopa)'], preparo: ['Misture o leite de coco com o coco ralado e o adoçante.', 'Distribua em formas de picolé e coloque os palitos.', 'Congele por no mínimo 4 horas.', 'Derreta o chocolate com o óleo de coco em banho-maria.', 'Deixe a calda amornar até ficar levemente morna (não quente).', 'Desenforme os picolés e mergulhe rapidamente na calda — ela endurece na hora.'], dica: '&#128161; <strong>Casquinha crocante:</strong> o óleo de coco é o que faz o chocolate endurecer no contato com o gelado.' }
            ],
            'proteicas': [
                { nome: 'Bolo de Whey Protein', emoji: '\u{1F382}', tempo: '35 min', porcoes: '8 fatias', calorias: 175, proteina: 14, carbo: 16, gordura: 6, ingredientes: ['Whey protein chocolate (60g / 2 scoops)', 'Ovos (4)', 'Banana madura (1 grande)', 'Aveia em flocos finos (80g)', 'Cacau em pó (2 col. sopa)', 'Leite desnatado (100ml)', 'Fermento em pó (1 col. chá)', 'Adoçante a gosto'], preparo: ['Pré-aqueça o forno a 180°C e unte uma forma média.', 'Amasse muito bem a banana com um garfo.', 'Bata os ovos com o adoçante por 3 minutos até ficarem espumosos.', 'Junte a banana amassada e o leite, batendo em velocidade baixa.', 'Incorpore a aveia, o whey e o cacau com espátula (não bata — o whey resseca).', 'Por último, misture o fermento delicadamente.', 'Asse por 25 minutos. Teste com palito aos 22 min.'], dica: '&#128161; <strong>Regra do whey em bolo:</strong> nunca asse demais. Whey seco vira borracha — tire assim que o palito sair limpo.' },
                { nome: 'Panqueca Proteica de Banana', emoji: '\u{1F95E}', tempo: '15 min', porcoes: '1 porção (3 panquecas)', calorias: 340, proteina: 32, carbo: 30, gordura: 9, ingredientes: ['Whey protein baunilha (30g)', 'Ovos (2)', 'Banana madura (1)', 'Aveia em flocos finos (30g)', 'Fermento em pó (1/2 col. chá)', 'Canela', 'Manteiga para untar'], preparo: ['Amasse a banana até virar um purê liso.', 'Bata os ovos e misture à banana.', 'Adicione a aveia, o whey, a canela e o fermento, mexendo até homogeneizar.', 'Deixe a massa descansar 3 minutos (a aveia hidrata e dá liga).', 'Aqueça a frigideira em fogo BAIXO com um pouco de manteiga.', 'Faça discos pequenos e cozinhe 2-3 minutos até aparecerem bolhas na superfície.', 'Vire com cuidado e cozinhe mais 1-2 minutos.'], dica: '&#128161; <strong>Discos pequenos</strong> viram muito mais fácil. Panqueca grande com whey quebra ao virar.' },
                { nome: 'Waffle Proteico de Whey', emoji: '\u{1F9C7}', tempo: '20 min', porcoes: '2 unidades', calorias: 245, proteina: 24, carbo: 22, gordura: 7, ingredientes: ['Whey protein baunilha (40g)', 'Ovos (2)', 'Aveia em flocos finos (50g)', 'Iogurte natural (2 col. sopa)', 'Fermento em pó (1 col. chá)', 'Adoçante e canela'], preparo: ['Pré-aqueça a máquina de waffle.', 'Bata os ovos com o iogurte.', 'Misture a aveia, o whey, o adoçante e a canela.', 'Junte o fermento por último e mexa apenas o suficiente.', 'Unte a máquina e despeje a massa sem encher demais.', 'Cozinhe por 4-5 minutos até dourar.'], dica: '&#128161; <strong>Sem máquina?</strong> Faça na frigideira como panqueca grossa, em fogo baixo e tampada.' },
                { nome: 'Barrinha Proteica Caseira', emoji: '\u{1F36B}', tempo: '20 min + 2h gelar', porcoes: '8 unidades', calorias: 195, proteina: 15, carbo: 17, gordura: 8, ingredientes: ['Whey protein (90g / 3 scoops)', 'Pasta de amendoim integral (80g)', 'Aveia em flocos (100g)', 'Mel ou xarope zero (60g)', 'Leite (60-80ml)', 'Chocolate 70% para cobrir (60g)'], preparo: ['Misture a aveia com o whey em uma tigela grande.', 'Aqueça levemente a pasta de amendoim com o mel até ficarem fluidos.', 'Junte aos secos e misture com as mãos.', 'Adicione o leite aos poucos até formar uma massa que não gruda e não esfarela.', 'Pressione FIRME em uma forma forrada com papel-manteiga (isso evita que esfarele).', 'Leve à geladeira por 1 hora, corte em barras.', 'Derreta o chocolate, banhe as barras e volte à geladeira por 1 hora.'], dica: '&#128161; <strong>Pressione com força</strong> usando o fundo de um copo. Barra mal compactada desmancha na mão.' },
                { nome: 'Sorvete Proteico de Whey', emoji: '\u{1F366}', tempo: '5 min', porcoes: '1 porção', calorias: 260, proteina: 28, carbo: 26, gordura: 4, ingredientes: ['Whey protein (30g)', 'Banana congelada em rodelas (1 grande)', 'Leite desnatado gelado (80ml)', 'Iogurte grego natural (2 col. sopa)', 'Gelo (4 cubos)', 'Canela'], preparo: ['Congele a banana em rodelas na véspera (mínimo 4 horas).', 'Coloque a banana congelada no liquidificador ou processador.', 'Adicione o leite aos poucos, apenas o suficiente para bater.', 'Junte o whey, o iogurte e o gelo.', 'Bata em pulsos até formar uma textura cremosa de sorvete.', 'Sirva imediatamente com canela por cima.'], dica: '&#128161; <strong>Pouco líquido</strong> é o segredo. Excesso de leite vira vitamina em vez de sorvete.' },
                { nome: 'Pudim Proteico de Whey', emoji: '\u{1F36E}', tempo: '10 min + 3h gelar', porcoes: '2 porções', calorias: 165, proteina: 22, carbo: 12, gordura: 3, ingredientes: ['Whey protein baunilha (40g)', 'Leite desnatado (300ml)', 'Gelatina incolor sem sabor (1 envelope)', 'Iogurte grego natural (100g)', 'Adoçante a gosto', 'Cacau em pó para polvilhar'], preparo: ['Hidrate a gelatina em 5 colheres de água fria por 5 minutos.', 'Dissolva no micro-ondas por 15 segundos (não deixe ferver).', 'Bata o leite com o whey, o iogurte e o adoçante no liquidificador.', 'Com o liquidificador ligado, adicione a gelatina dissolvida em fio.', 'Bata mais 30 segundos.', 'Distribua em taças e leve à geladeira por 3 horas.'], dica: '&#128161; <strong>Gelatina fervida perde o poder de firmar.</strong> Aqueça só até dissolver.' },
                { nome: 'Mousse de Whey com Iogurte Grego', emoji: '\u{1F368}', tempo: '10 min + 1h gelar', porcoes: '2 porções', calorias: 180, proteina: 26, carbo: 13, gordura: 3, ingredientes: ['Iogurte grego natural (300g)', 'Whey protein (30g)', 'Cacau em pó (1 col. sopa)', 'Adoçante a gosto', 'Frutas vermelhas para decorar'], preparo: ['Bata o iogurte grego com um fouet por 1 minuto para aerar.', 'Peneire o whey e o cacau sobre o iogurte (peneirar evita grumos).', 'Misture delicadamente com espátula, em movimentos de baixo para cima.', 'Ajuste o adoçante.', 'Distribua em taças e gele por 1 hora.', 'Decore com frutas vermelhas na hora de servir.'], dica: '&#128161; <strong>Sempre peneire o whey</strong> em preparos frios — sem isso ficam bolinhas no meio da mousse.' },
                { nome: 'Shake Ovomaltine Proteico', emoji: '\u{1F95B}', tempo: '5 min', porcoes: '1 porção', calorias: 310, proteina: 30, carbo: 30, gordura: 7, ingredientes: ['Leite desnatado (250ml)', 'Whey protein baunilha (30g)', 'Ovomaltine (2 col. sopa)', 'Banana (1/2)', 'Gelo (5 cubos)'], preparo: ['Coloque o leite gelado no liquidificador primeiro.', 'Adicione a banana, o whey e o Ovomaltine.', 'Bata por 30 segundos.', 'Junte o gelo e bata mais 30 segundos até ficar espumoso.', 'Sirva imediatamente.'], dica: '&#128161; <strong>Líquido sempre primeiro</strong> no liquidificador — evita o pó grudar nas lâminas.' },
                { nome: 'Bolinho de Frango com Aveia', emoji: '\u{1F357}', tempo: '35 min', porcoes: '10 unidades', calorias: 105, proteina: 13, carbo: 6, gordura: 3, ingredientes: ['Frango moído ou desfiado (400g)', 'Aveia em flocos finos (60g)', 'Ovo (1)', 'Cebola picada fina (1/2)', 'Alho (2 dentes)', 'Salsinha, sal, pimenta e páprica'], preparo: ['Pré-aqueça o forno a 190°C.', 'Refogue rapidamente a cebola e o alho e deixe esfriar.', 'Misture o frango com o ovo, a aveia e o refogado.', 'Tempere com sal, pimenta, páprica e salsinha.', 'Deixe a mistura descansar 10 minutos (a aveia hidrata e dá liga).', 'Modele bolinhos e disponha em assadeira forrada.', 'Asse por 20-25 minutos, virando na metade.'], dica: '&#128161; <strong>Congela muito bem cru.</strong> Faça 30 de uma vez e asse direto do freezer (+8 min).' },
                { nome: 'Escondidinho Proteico de Carne', emoji: '\u{1F372}', tempo: '50 min', porcoes: '4 porções', calorias: 385, proteina: 35, carbo: 32, gordura: 12, ingredientes: ['Carne moída patinho (500g)', 'Batata-doce cozida (500g)', 'Leite desnatado (80ml)', 'Cebola (1)', 'Alho (3 dentes)', 'Extrato de tomate (2 col. sopa)', 'Queijo ralado (60g)', 'Azeite, sal, pimenta e cheiro-verde'], preparo: ['Cozinhe a batata-doce até ficar bem macia e amasse ainda quente.', 'Adicione o leite aos poucos até formar um purê cremoso. Tempere e reserve.', 'Refogue a cebola e o alho no azeite.', 'Junte a carne moída e deixe dourar bem, mexendo pouco (mexer demais cozinha no vapor).', 'Adicione o extrato de tomate, tempere e cozinhe 5 minutos.', 'Em um refratário, faça uma camada de carne e cubra com o purê.', 'Polvilhe o queijo e leve ao forno a 200°C por 15 minutos para gratinar.'], dica: '&#128161; <strong>Carne dourada de verdade:</strong> panela bem quente e não mexa nos primeiros 3 minutos.' },
                { nome: 'Omelete Proteico de Claras', emoji: '\u{1F373}', tempo: '15 min', porcoes: '1 porção', calorias: 265, proteina: 42, carbo: 5, gordura: 8, ingredientes: ['Claras de ovo (6)', 'Ovo inteiro (1)', 'Frango desfiado (100g)', 'Espinafre (1 punhado)', 'Tomate picado (1/2)', 'Queijo cottage (2 col. sopa)', 'Sal, pimenta e azeite'], preparo: ['Bata as claras com o ovo inteiro, sal e pimenta.', 'Aqueça a frigideira em fogo médio-baixo com azeite.', 'Refogue o espinafre e o tomate por 1 minuto e reserve.', 'Despeje os ovos e cozinhe puxando as bordas para o centro.', 'Quando quase firme, distribua o frango, os vegetais e o cottage em uma metade.', 'Dobre e cozinhe mais 1 minuto.'], dica: '&#128161; <strong>1 ovo inteiro no meio das claras</strong> melhora muito o sabor e a textura sem pesar nas calorias.' },
                { nome: 'Cookies Proteicos de Whey', emoji: '\u{1F36A}', tempo: '25 min', porcoes: '10 unidades', calorias: 115, proteina: 9, carbo: 11, gordura: 4, ingredientes: ['Whey protein baunilha (60g)', 'Aveia em flocos finos (80g)', 'Pasta de amendoim (40g)', 'Banana madura (1)', 'Clara de ovo (1)', 'Gotas de chocolate 70% (30g)', 'Canela e adoçante'], preparo: ['Pré-aqueça o forno a 180°C.', 'Amasse a banana até virar purê.', 'Misture a pasta de amendoim e a clara.', 'Adicione a aveia, o whey, a canela e o adoçante.', 'Incorpore as gotas de chocolate.', 'Modele os cookies e achate levemente com as costas de uma colher.', 'Asse por 12-14 minutos — eles firmam ao esfriar.'], dica: '&#128161; <strong>Não asse até ficarem duros.</strong> Saem do forno macios e endurecem esfriando.' },
                { nome: 'Crepioca Proteica de Frango', emoji: '\u{1F32F}', tempo: '15 min', porcoes: '1 porção', calorias: 320, proteina: 34, carbo: 22, gordura: 10, ingredientes: ['Ovos (2)', 'Goma de tapioca (2 col. sopa)', 'Frango desfiado (100g)', 'Requeijão light (1 col. sopa)', 'Orégano, sal e pimenta'], preparo: ['Bata os ovos com a goma de tapioca, o sal e a pimenta até dissolver.', 'Aqueça uma frigideira antiaderente em fogo médio.', 'Despeje a massa e espalhe formando um disco fino.', 'Cozinhe 2 minutos até soltar da frigideira, então vire.', 'Espalhe o requeijão em uma metade e distribua o frango.', 'Dobre ao meio, finalize com orégano e sirva.'], dica: '&#128161; <strong>Massa lisa:</strong> misture e deixe descansar 2 min antes de fritar — a goma dissolve por completo.' },
                { nome: 'Muffin Proteico de Whey e Banana', emoji: '\u{1F9C1}', tempo: '30 min', porcoes: '6 unidades', calorias: 150, proteina: 13, carbo: 15, gordura: 5, ingredientes: ['Whey protein (60g)', 'Aveia em flocos finos (80g)', 'Bananas maduras (2)', 'Ovos (2)', 'Iogurte natural (60g)', 'Fermento em pó (1 col. chá)', 'Canela e adoçante'], preparo: ['Pré-aqueça o forno a 180°C e unte forminhas de muffin.', 'Amasse as bananas e misture com os ovos e o iogurte.', 'Adicione a aveia, o whey, a canela e o adoçante.', 'Junte o fermento por último.', 'Distribua nas forminhas até 3/4 da altura.', 'Asse por 18-20 minutos até o palito sair limpo.'], dica: '&#128161; <strong>Lanche da semana:</strong> guarde na geladeira por 4 dias ou congele por 60 dias.' },
                { nome: 'Frango Desfiado com Arroz e Feijão', emoji: '\u{1F35A}', tempo: '30 min', porcoes: '2 porções', calorias: 480, proteina: 42, carbo: 48, gordura: 11, ingredientes: ['Peito de frango cozido e desfiado (300g)', 'Arroz integral cozido (200g)', 'Feijão carioca cozido (150g)', 'Cebola (1/2)', 'Alho (3 dentes)', 'Azeite, sal, pimenta, cominho e cheiro-verde'], preparo: ['Refogue a cebola e o alho no azeite até dourarem.', 'Junte o frango desfiado e refogue por 5 minutos.', 'Tempere com sal, pimenta e cominho.', 'Adicione o feijão escorrido e cozinhe mais 3 minutos.', 'Misture o arroz integral e mexa até aquecer tudo por igual.', 'Finalize com cheiro-verde fresco.'], dica: '&#128161; <strong>Prato completo de meal prep:</strong> divida em 2 potes e leve para o trabalho.' },
                { nome: 'Tilápia Grelhada com Quinoa', emoji: '\u{1F41F}', tempo: '25 min', porcoes: '1 porção', calorias: 400, proteina: 44, carbo: 30, gordura: 11, ingredientes: ['Filé de tilápia (200g)', 'Quinoa cozida (150g)', 'Limão (1)', 'Alho (2 dentes)', 'Azeite (1 col. sopa)', 'Brócolis no vapor (100g)', 'Sal, pimenta e salsinha'], preparo: ['Tempere a tilápia com sal, pimenta, alho e suco de limão. Deixe 10 minutos.', 'Aqueça uma frigideira antiaderente com azeite em fogo médio-alto.', 'Grelhe o filé por 3-4 minutos de cada lado, sem mexer.', 'Cozinhe o brócolis no vapor por 5 minutos (deve continuar verde vivo).', 'Monte o prato com a quinoa, o brócolis e o peixe.', 'Finalize com salsinha e um fio de azeite.'], dica: '&#128161; <strong>Peixe não gruda</strong> se a frigideira estiver bem quente antes de colocar o filé.' },
                { nome: 'Iogurte Grego com Granola Proteica', emoji: '\u{1F368}', tempo: '5 min', porcoes: '1 porção', calorias: 330, proteina: 30, carbo: 32, gordura: 9, ingredientes: ['Iogurte grego natural (200g)', 'Whey protein (20g)', 'Granola sem açúcar (30g)', 'Frutas vermelhas (80g)', 'Pasta de amendoim (1 col. chá)', 'Mel ou adoçante'], preparo: ['Misture o whey peneirado ao iogurte grego até ficar liso.', 'Monte em camadas em um copo ou taça: iogurte, granola, frutas.', 'Repita as camadas.', 'Finalize com a pasta de amendoim por cima.', 'Sirva imediatamente para a granola manter a crocância.'], dica: '&#128161; <strong>Monte na hora de comer.</strong> Granola parada no iogurte amolece em minutos.' },
                { nome: 'Rocambole de Frango Proteico', emoji: '\u{1F357}', tempo: '45 min', porcoes: '4 porções', calorias: 285, proteina: 38, carbo: 6, gordura: 12, ingredientes: ['Frango moído (500g)', 'Ovo (1)', 'Aveia em flocos finos (40g)', 'Queijo cottage (100g)', 'Espinafre refogado (100g)', 'Cebola, alho, sal, pimenta e orégano'], preparo: ['Pré-aqueça o forno a 190°C.', 'Misture o frango moído com o ovo, a aveia e os temperos até dar liga.', 'Abra a massa sobre papel-manteiga formando um retângulo de 1cm de espessura.', 'Distribua o cottage e o espinafre por cima, deixando 2cm de borda livre.', 'Enrole usando o papel como apoio, como um rocambole.', 'Transfira para a assadeira com a emenda para baixo.', 'Asse por 30-35 minutos até dourar.'], dica: '&#128161; <strong>Deixe descansar 10 min</strong> antes de fatiar — quente demais, ele desmancha ao cortar.' },
                { nome: 'Brigadeiro de Whey', emoji: '\u{1F36B}', tempo: '15 min', porcoes: '10 unidades', calorias: 75, proteina: 7, carbo: 6, gordura: 3, ingredientes: ['Whey protein chocolate (60g)', 'Leite em pó desnatado (40g)', 'Cacau em pó (1 col. sopa)', 'Leite desnatado (60-80ml)', 'Adoçante culinário a gosto', 'Cacau extra para enrolar'], preparo: ['Misture o whey, o leite em pó e o cacau em uma tigela.', 'Adicione o leite aos poucos, mexendo até formar uma pasta firme.', 'A massa deve desgrudar das mãos — se estiver mole, junte mais leite em pó.', 'Leve à geladeira por 30 minutos para firmar.', 'Modele as bolinhas com as mãos levemente untadas.', 'Passe no cacau em pó e sirva gelado.'], dica: '&#128161; <strong>Adicione o leite bem devagar.</strong> Passou do ponto, só o leite em pó recupera.' },
                { nome: 'Overnight Oats Proteico', emoji: '\u{1F963}', tempo: '5 min + 8h geladeira', porcoes: '1 porção', calorias: 385, proteina: 28, carbo: 42, gordura: 10, ingredientes: ['Aveia em flocos (60g)', 'Whey protein baunilha (30g)', 'Leite desnatado (180ml)', 'Iogurte natural (2 col. sopa)', 'Chia (1 col. sopa)', 'Banana ou frutas vermelhas', 'Canela'], preparo: ['Em um pote com tampa, misture a aveia, a chia e o whey peneirado.', 'Adicione o leite e o iogurte, mexendo bem para não formar grumos.', 'Junte a canela e o adoçante se quiser.', 'Tampe e leve à geladeira de um dia para o outro (mínimo 6 horas).', 'De manhã, mexa e adicione as frutas por cima.'], dica: '&#128161; <strong>Café da manhã pronto:</strong> prepare 3 potes no domingo à noite e resolva metade da semana.' }

            'zero-lactose': [

                { nome: 'Cupcake Fit de Baunilha', emoji: '\u{1F9C1}', tempo: '30 min', porcoes: '8 unidades', calorias: 140, proteina: 9, carbo: 17, gordura: 4, ingredientes: ['Farinha de aveia (140g)', 'Whey protein baunilha (30g)', 'Ovos (2)', 'Iogurte natural (120g)', 'Adoçante culinário (70g)', 'Leite desnatado (60ml)', 'Fermento em pó (1 col. chá)', 'Essência de baunilha'], preparo: ['Pré-aqueça o forno a 180°C e forre forminhas.', 'Bata os ovos com o adoçante por 3 minutos.', 'Adicione o iogurte, o leite e a baunilha.', 'Peneire a farinha de aveia e o whey e incorpore com espátula.', 'Junte o fermento por último.', 'Preencha as forminhas até 3/4 e asse por 18 minutos.'], dica: '&#128161; <strong>Não encha até a borda</strong> — a massa cresce e transborda, deixando o cupcake torto.' },
                { nome: 'Trufa Fit de Chocolate', emoji: '\u{1F36C}', tempo: '20 min + 2h gelar', porcoes: '12 unidades', calorias: 85, proteina: 5, carbo: 7, gordura: 5, ingredientes: ['Chocolate 70% (100g)', 'Iogurte grego natural (100g)', 'Whey protein chocolate (30g)', 'Cacau em pó para enrolar', 'Óleo de coco (1 col. chá)'], preparo: ['Derreta o chocolate com o óleo de coco em banho-maria.', 'Deixe amornar até ficar levemente morno (importante).', 'Misture o iogurte grego mexendo rápido com fouet.', 'Adicione o whey peneirado e mexa até ficar liso.', 'Leve à geladeira por 2 horas até firmar bem.', 'Modele as bolinhas com as mãos e passe no cacau.'], dica: '&#128161; <strong>Chocolate quente + iogurte gelado</strong> talha a mistura. Sempre deixe o chocolate amornar antes.' },
                { nome: 'Rocambole Fit de Doce de Leite', emoji: '\u{1F370}', tempo: '35 min', porcoes: '8 fatias', calorias: 165, proteina: 10, carbo: 20, gordura: 5, ingredientes: ['MASSA: Ovos (4)', 'MASSA: Farinha de aveia (80g)', 'MASSA: Adoçante culinário (60g)', 'MASSA: Fermento (1/2 col. chá)', 'RECHEIO: Leite condensado zero cozido (200g)', 'RECHEIO: Iogurte grego (100g)'], preparo: ['Pré-aqueça o forno a 180°C e forre uma assadeira retangular com papel-manteiga.', 'Separe as claras e bata em neve firme.', 'Bata as gemas com o adoçante e incorpore a farinha de aveia.', 'Misture as claras em neve delicadamente, de baixo para cima.', 'Espalhe em camada fina na assadeira e asse por apenas 12 minutos.', 'Desenforme ainda quente sobre um pano úmido e enrole SEM o recheio. Espere amornar.', 'Desenrole, espalhe o recheio misturado e enrole novamente.'], dica: '&#128161; <strong>Enrolar quente sem recheio</strong> ensina a massa a curvar — é o que impede que ela rache depois.' },
                { nome: 'Petit Gateau Fit', emoji: '\u{1F36E}', tempo: '25 min', porcoes: '4 unidades', calorias: 210, proteina: 12, carbo: 20, gordura: 9, ingredientes: ['Chocolate 70% (80g)', 'Manteiga (30g)', 'Ovos (2)', 'Whey protein chocolate (25g)', 'Farinha de aveia (30g)', 'Adoçante culinário (50g)', 'Cacau em pó (1 col. sopa)'], preparo: ['Pré-aqueça o forno a 200°C e unte 4 forminhas individuais.', 'Derreta o chocolate com a manteiga em banho-maria e deixe amornar.', 'Bata os ovos com o adoçante por 3 minutos.', 'Junte o chocolate morno, mexendo em velocidade baixa.', 'Incorpore a farinha de aveia, o whey e o cacau peneirados.', 'Distribua nas forminhas e asse por 9-11 MINUTOS apenas.', 'As bordas ficam firmes e o centro mole. Desenforme na hora e sirva quente.'], dica: '&#128161; <strong>O tempo é tudo aqui.</strong> 1 minuto a mais e você tem um bolinho comum, sem o centro cremoso.' }
            ]
        };

        const nomesCategorias = {
            'low-carb': 'Low Carb',
            'proteicas': 'Proteicas',
            'zero-lactose': 'Zero Lactose',
            'doce-fit': 'Doce Fit'
        };

        let filtroAtual = 'todas';
        let termoBusca = '';

        function receitaCombina(receita) {
            if (!termoBusca) return true;
            const alvo = (receita.nome + ' ' + receita.ingredientes.join(' ')).toLowerCase();
            return alvo.indexOf(termoBusca) !== -1;
        }

        function criarCartaReceita(receita, categoria, index) {
            const extras = receita.ingredientes.length > 5
                ? '<div class="mais-ingredientes">+ ' + (receita.ingredientes.length - 5) + ' ingrediente(s)</div>'
                : '';
            return '' +
                '<div class="receita-card" onclick="abrirModal(\'' + categoria + '\', ' + index + ')">' +
                    '<div class="receita-header">' +
                        '<div class="receita-emoji">' + receita.emoji + '</div>' +
                        '<div class="receita-nome">' + receita.nome + '</div>' +
                        '<div class="receita-tempo">&#9201; ' + receita.tempo + ' &nbsp;|&nbsp; ' + receita.porcoes + '</div>' +
                    '</div>' +
                    '<div class="receita-content">' +
                        '<div class="receita-macros">' +
                            '<div><div class="macro-receita">Calorias</div><div class="macro-valor-receita">' + receita.calorias + '</div></div>' +
                            '<div><div class="macro-receita">Prote&iacute;na</div><div class="macro-valor-receita">' + receita.proteina + 'g</div></div>' +
                            '<div><div class="macro-receita">Carbo</div><div class="macro-valor-receita">' + receita.carbo + 'g</div></div>' +
                            '<div><div class="macro-receita">Gordura</div><div class="macro-valor-receita">' + receita.gordura + 'g</div></div>' +
                        '</div>' +
                        '<div class="receita-ingredientes">' +
                            '<div class="receita-titulo">Ingredientes</div>' +
                            '<ul class="ingredientes-lista">' +
                                receita.ingredientes.slice(0, 5).map(function(ing) { return '<li>' + ing + '</li>'; }).join('') +
                            '</ul>' +
                            extras +
                        '</div>' +
                        '<button class="btn-ver-preparo">Ver Modo de Preparo &#8594;</button>' +
                    '</div>' +
                '</div>';
        }

        function renderizarReceitas() {
            const container = document.getElementById('receitasContainer');
            container.innerHTML = '';

            const chaves = filtroAtual === 'todas' ? Object.keys(receitas) : [filtroAtual];
            let totalMostrado = 0;

            chaves.forEach(function(chave) {
                const lista = receitas[chave] || [];
                const cards = [];

                lista.forEach(function(receita, index) {
                    if (receitaCombina(receita)) {
                        cards.push(criarCartaReceita(receita, chave, index));
                    }
                });

                if (cards.length > 0) {
                    totalMostrado += cards.length;

                    if (filtroAtual === 'todas' || termoBusca) {
                        const titulo = document.createElement('h2');
                        titulo.className = 'categoria-titulo';
                        titulo.textContent = nomesCategorias[chave] + ' (' + cards.length + ')';
                        container.appendChild(titulo);
                    }

                    const grid = document.createElement('div');
                    grid.className = 'receitas-grid';
                    grid.innerHTML = cards.join('');
                    container.appendChild(grid);
                }
            });

            if (totalMostrado === 0) {
                container.innerHTML = '<p class="sem-resultado">Nenhuma receita encontrada para essa busca.</p>';
            }
        }

        function filtrarReceitas(filtro, botao) {
            filtroAtual = filtro;
            const botoes = document.querySelectorAll('.filtro-receita-btn');
            for (let i = 0; i < botoes.length; i++) {
                botoes[i].classList.remove('ativo');
            }
            if (botao) botao.classList.add('ativo');
            renderizarReceitas();
        }

        function buscarReceitas() {
            termoBusca = document.getElementById('buscaReceita').value.trim().toLowerCase();
            renderizarReceitas();
        }

        function abrirModal(categoria, index) {
            const receita = receitas[categoria][index];

            document.getElementById('modalTitulo').textContent = receita.nome;
            document.getElementById('modalSub').textContent = receita.tempo + '  |  ' + receita.porcoes + '  |  ' + nomesCategorias[categoria];

            document.getElementById('modalMacros').innerHTML = '' +
                '<div><div class="macro-receita">Calorias</div><div class="macro-valor-receita">' + receita.calorias + '</div></div>' +
                '<div><div class="macro-receita">Prote&iacute;na</div><div class="macro-valor-receita">' + receita.proteina + 'g</div></div>' +
                '<div><div class="macro-receita">Carbo</div><div class="macro-valor-receita">' + receita.carbo + 'g</div></div>' +
                '<div><div class="macro-receita">Gordura</div><div class="macro-valor-receita">' + receita.gordura + 'g</div></div>';

            document.getElementById('modoPreparo').innerHTML = '' +
                '<h3>Ingredientes</h3>' +
                '<ul>' + receita.ingredientes.map(function(ing) { return '<li>' + ing + '</li>'; }).join('') + '</ul>' +
                '<h3>Modo de Preparo</h3>' +
                '<ol>' + receita.preparo.map(function(passo) { return '<li>' + passo + '</li>'; }).join('') + '</ol>';

            document.getElementById('dicaPreparo').innerHTML = receita.dica;

            document.getElementById('modalReceita').classList.add('ativo');
            document.body.style.overflow = 'hidden';
        }

        function fecharModal() {
            document.getElementById('modalReceita').classList.remove('ativo');
            document.body.style.overflow = '';
        }

        document.getElementById('modalReceita').onclick = function(e) {
            if (e.target.id === 'modalReceita') fecharModal();
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharModal();
        });

        renderizarReceitas();
    </script>
